sonar.projectKey=ai-cabinet-dev
sonar.projectName=AI Cabinet (dev)
sonar.projectVersion=0.1.0-SNAPSHOT

# Community：main 分支请用 projectKey=ai-cabinet-main（见 scripts/ci/run-sonar.ps1 -Branch main）

sonar.sourceEncoding=UTF-8

# Java + 前端（运营后台 + 消费者/商户小程序）
sonar.java.source=17
sonar.modules=trade-service,device-service,common-core,admin-vue,consumer-mp,merchant-mp

trade-service.sonar.projectBaseDir=services/trade-service
trade-service.sonar.sources=src/main/java
trade-service.sonar.tests=src/test/java
trade-service.sonar.java.binaries=target/classes
trade-service.sonar.exclusions=**/target/**,**/static/admin/**

device-service.sonar.projectBaseDir=services/device-service
device-service.sonar.sources=src/main/java
device-service.sonar.tests=src/test/java
device-service.sonar.java.binaries=target/classes

common-core.sonar.projectBaseDir=services/common/common-core
common-core.sonar.sources=src/main/java
common-core.sonar.java.binaries=target/classes

admin-vue.sonar.projectBaseDir=clients/admin-vue
admin-vue.sonar.sources=src
admin-vue.sonar.exclusions=**/node_modules/**,**/dist/**

consumer-mp.sonar.projectBaseDir=clients/consumer-mp
consumer-mp.sonar.sources=src
consumer-mp.sonar.exclusions=**/node_modules/**,**/dist/**,**/unpackage/**

merchant-mp.sonar.projectBaseDir=clients/merchant-mp
merchant-mp.sonar.sources=src
merchant-mp.sonar.exclusions=**/node_modules/**,**/dist/**,**/unpackage/**

sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/unpackage/**,**/*.min.js,**/static/admin/**
