<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI开门柜 · 运营管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <h1>AI开门柜 · 运营管理系统</h1>
    <p class="sub">设备监控 · 订单管理 · 商品维护 · 用户管理 · 争议审核</p>
    <div class="login-tabs">
      <button type="button" class="login-tab active" data-mode="password" onclick="switchLoginMode('password')">密码登录</button>
      <button type="button" class="login-tab" data-mode="sms" onclick="switchLoginMode('sms')">验证码登录</button>
    </div>
    <form id="loginForm" autocomplete="on">
      <p id="loginDevHint" class="login-hint hidden">本地测试：运营账号 13900000001，密码 123456（须已在数据库中）</p>
      <label for="phone">手机号</label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="11位手机号" autocomplete="username">
      <div id="loginPasswordBlock">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="登录密码" autocomplete="current-password">
      </div>
      <div id="loginSmsBlock" class="hidden">
        <label for="code">验证码</label>
        <div class="filters">
          <div style="flex:2"><input id="code" name="code" placeholder="短信验证码" autocomplete="one-time-code"></div>
          <div><button type="button" class="btn-ghost" id="sendCodeBtn" onclick="sendCode()">获取验证码</button></div>
        </div>
      </div>
      <button type="submit" class="btn-primary" style="width:100%;margin-top:12px" id="loginBtn">登录</button>
    </form>
    <div id="loginErr" class="err hidden"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <div id="sidebarBackdrop" class="sidebar-backdrop hidden" onclick="toggleSidebar(false)"></div>
  <nav class="sidebar">
    <div class="brand">AI开门柜 OPS</div>

    <div class="nav-section" data-nav-group="overview">
      <button type="button" class="nav-section-toggle" onclick="toggleNavSection('overview')" aria-expanded="true">
        <span>概览</span><span class="nav-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="nav-section-body">
        <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">数据概览</a>
      </div>
    </div>

    <div class="nav-section" data-nav-group="business">
      <button type="button" class="nav-section-toggle" onclick="toggleNavSection('business')" aria-expanded="false">
        <span>业务</span><span class="nav-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="nav-section-body">
        <a class="nav-item" data-page="devices" onclick="navigate('devices')">设备</a>
        <a class="nav-item" data-page="sessions" onclick="navigate('sessions')">会话</a>
        <a class="nav-item" data-page="upload-queue" onclick="navigate('upload-queue')">上传队列</a>
        <a class="nav-item" data-page="orders" onclick="navigate('orders')">订单</a>
        <a class="nav-item" data-page="recharges" onclick="navigate('recharges')">充值</a>
        <a class="nav-item" data-page="skus" onclick="navigate('skus')">商品</a>
        <a class="nav-item" data-page="vision-mappings" onclick="navigate('vision-mappings')">视觉映射</a>
        <a class="nav-item" data-page="users" onclick="navigate('users')">用户</a>
        <a class="nav-item" data-page="disputes" onclick="navigate('disputes')">争议审核</a>
      </div>
    </div>

    <div class="nav-section" data-nav-group="reports">
      <button type="button" class="nav-section-toggle" onclick="toggleNavSection('reports')" aria-expanded="false">
        <span>报表</span><span class="nav-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="nav-section-body">
        <a class="nav-item" data-page="reports" onclick="navigate('reports')">设备报表</a>
        <a class="nav-item" data-page="audit" onclick="navigate('audit')">操作日志</a>
        <a class="nav-item" data-page="recent" onclick="navigate('recent')">最近操作</a>
        <a class="nav-item" data-page="sla" onclick="navigate('sla')">SLA 监控</a>
      </div>
    </div>

    <div class="nav-section" data-nav-group="ops">
      <button type="button" class="nav-section-toggle" onclick="toggleNavSection('ops')" aria-expanded="false">
        <span>运营</span><span class="nav-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="nav-section-body">
        <a class="nav-item" data-page="ota" onclick="navigate('ota')">设备 OTA</a>
        <a class="nav-item" data-page="risk" onclick="navigate('risk')">风控</a>
        <a class="nav-item" data-page="reconciliation" onclick="navigate('reconciliation')">对账</a>
        <a class="nav-item" data-page="replenishment" onclick="navigate('replenishment')">补货</a>
        <a class="nav-item" data-page="warehouse" onclick="navigate('warehouse')">仓库</a>
        <a class="nav-item" data-page="finance" onclick="navigate('finance')">财务 COGS</a>
        <a class="nav-item" data-page="merchants" onclick="navigate('merchants')">商户分账</a>
      </div>
    </div>

    <div class="nav-section" data-nav-group="system">
      <button type="button" class="nav-section-toggle" onclick="toggleNavSection('system')" aria-expanded="false">
        <span>系统</span><span class="nav-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="nav-section-body">
        <a class="nav-item" data-page="rbac" onclick="navigate('rbac')">权限管理</a>
      </div>
    </div>
  </nav>
  <main class="main">
    <div class="main-header">
      <div class="topbar">
        <h2 id="pageTitle">概览</h2>
        <div class="topbar-actions">
          <div class="topbar-user" id="userInfo">
            <span class="user-name">运营账号</span>
            <span class="user-detail">加载中…</span>
          </div>
          <button type="button" id="themeToggle" class="btn-ghost btn-sm theme-toggle" onclick="toggleTheme()" title="切换主题">浅色</button>
          <button class="btn-ghost btn-sm" onclick="logout()">退出</button>
        </div>
      </div>
      <div id="tagsView" class="tags-view" aria-label="最近访问"></div>
    </div>
    <div class="main-body">
      <div id="pageContent"></div>
    </div>
  </main>
</div>

<div id="modalRoot" class="hidden"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="admin-common.js"></script>
<script src="permissions.js"></script>
<script src="app.js"></script>
<script src="ops-modules.js"></script>
</body>
</html>
