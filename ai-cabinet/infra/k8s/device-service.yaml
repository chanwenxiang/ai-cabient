apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: ai-cabinet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-service
  template:
    metadata:
      labels:
        app: device-service
    spec:
      containers:
        - name: device-service
          image: ai-cabinet/device-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: AICABINET_TRADE_SERVICE_URL
              value: http://trade-service:8080
            - name: MQTT_BROKER
              value: ssl://emqx:8883
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-cabinet-secrets
                  key: internal-api-key
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-cabinet-secrets
                  key: mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-cabinet-secrets
                  key: mqtt-password
---
apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: ai-cabinet
spec:
  selector:
    app: device-service
  ports:
    - port: 8081
      targetPort: 8081
