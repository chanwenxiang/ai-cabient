apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-cabinet-gateway
  namespace: ai-cabinet
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: cabinet.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trade-service
                port:
                  number: 8080
