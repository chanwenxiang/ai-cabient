apiVersion: v1
kind: Secret
metadata:
  name: ai-cabinet-secrets
  namespace: ai-cabinet
type: Opaque
stringData:
  # 部署前替换为强随机值，勿使用示例
  postgres-password: CHANGE_ME
  JWT_SECRET: CHANGE_ME_MIN_32_CHARS_RANDOM_STRING_HERE
  INTERNAL_API_KEY: CHANGE_ME_MIN_32_CHARS_RANDOM_STRING_HERE
  VISION_API_KEY: CHANGE_ME_MIN_32_CHARS_RANDOM_STRING_HERE
  WECHAT_API_V3_KEY: ""
  WECHAT_MCH_SERIAL: ""
  WECHAT_PRIVATE_KEY: ""
  WECHAT_PLATFORM_CERT: ""
  WECHAT_PLATFORM_CERT_AUTO_FETCH: "true"
  WECHAT_MINIAPP_SECRET: ""
  MINIO_SECRET_KEY: CHANGE_ME
  SMS_WEBHOOK_URL: https://your-sms-gateway/send
