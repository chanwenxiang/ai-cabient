global:
  scrape_interval: 15s

scrape_configs:
  - job_name: trade-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: device-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
