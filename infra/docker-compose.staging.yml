# 预发/试点 Compose 叠加层 — 配合 deploy-staging.ps1
# 用法：docker compose -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.staging.yml --profile apps up -d

services:
  sms-webhook-mock:
    stop_grace_period: 30s
    image: python:3.12-slim
    volumes:
      - ../scripts/sms-webhook-mock.py:/app/sms-webhook-mock.py:ro
    command: python /app/sms-webhook-mock.py
    ports:
      # 审计 P2-24：容器间走 sms-webhook-mock:8099（compose 网络），宿主无需可达 → 回环绑定
      - "127.0.0.1:8099:8099"
    environment:
      PORT: "8099"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: ["apps"]

  trade-service:
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: staging
      AICABINET_STAGING_MODE: "true"
      AICABINET_MOCK_ENABLED: "false"
      AICABINET_SECURITY_MOCK_ENABLED: "false"
      CHECKOUT_BALANCE_ONLY: ${CHECKOUT_BALANCE_ONLY:-true}
      # 审计 P2-20：staging 是「接近 prod 的环境」，对账 mock 默认关（原默认 true 即模板教用户开 mock）；
      # 确需联调对账 mock 时在 .env.staging 显式打开
      RECON_MOCK_ENABLED: ${RECON_MOCK_ENABLED:-false}
      SMS_WEBHOOK_URL: http://sms-webhook-mock:8099/send
      # X2：环境层显式钉死支付/分账/提现 mock（防假成功纵深；validator 仍另强校验）
      PAYSCORE_MOCK_ENABLED: ${PAYSCORE_MOCK_ENABLED:-false}
      PROFIT_SHARING_MOCK_ENABLED: ${PROFIT_SHARING_MOCK_ENABLED:-false}
      LINE_WITHDRAW_MOCK_ENABLED: ${LINE_WITHDRAW_MOCK_ENABLED:-false}
      MERCHANT_WITHDRAW_MOCK_ENABLED: ${MERCHANT_WITHDRAW_MOCK_ENABLED:-false}
      # L2-4：staging 也必须显式配置 Redis 密码（fail-loud）
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.staging}
    depends_on:
      sms-webhook-mock:
        condition: service_healthy

  vision-service:
    stop_grace_period: 30s
    build:
      args:
        # 审计 P2-13：云端 YOLO 识别已退役（工厂仅剩 quectel/mock），不再安装无用 ML 依赖扩大镜像攻击面
        INSTALL_ML: ${VISION_INSTALL_ML:-false}
    environment:
      # H69：让 vision-service 识别 staging 为安全环境（拒 MOCK/默认 Key、关 /docs）
      APP_ENV: staging
      MOCK_ENABLED: ${VISION_MOCK_ENABLED:-false}
      # X2 + 审计 P2-13：云端识别已退役、生产识别走端侧直报（/internal/v1/vision/edge-results）。
      # 默认 quectel（端侧 provider 占位）：其 stub available=false 会让启动 fail-loud——
      # 这是「接真前云端识别不可用」的诚实姿态；原默认 yolo 已进弃用名单，按默认起必崩且误导排障。
      RECOGNIZER_BACKEND: ${RECOGNIZER_BACKEND:-quectel}
