# 生产 Compose 叠加层 — 配合 deploy-production.ps1
# 用法：
#   docker compose -p ai-cabinet \
#     -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.production.yml \
#     [-f docker-compose.xxljob.yml] \
#     --env-file .env.production --profile apps up -d --build

services:
  trade-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AICABINET_STAGING_MODE: "false"
      AICABINET_MOCK_ENABLED: "false"
      AICABINET_SECURITY_MOCK_ENABLED: "false"
      # B-6：生产须显式配置内部 API CIDR
      INTERNAL_API_ALLOWED_CIDRS: ${INTERNAL_API_ALLOWED_CIDRS:?set INTERNAL_API_ALLOWED_CIDRS in .env.production}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN in .env.production}

  vision-service:
    environment:
      MOCK_ENABLED: "false"
      # A-I1：生产禁止默认回落 mock
      RECOGNIZER_BACKEND: ${RECOGNIZER_BACKEND:?set RECOGNIZER_BACKEND (not mock) in .env.production}
      VISION_DISABLE_DOCS: "true"
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}

  device-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MQTT_BROKER: ${MQTT_BROKER:-ssl://emqx:8883}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME (aicabinet-backend) in .env.production}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env.production}

  emqx:
    image: emqx/emqx:5.8.6
    environment:
      # B-11(v2)：EMQX 5 没有 allow_anonymous / EMQX_AUTH__USER__* 这些 4.x 键，写了对 5.x 无效——
      # 且 5.x 未配置任何认证器时默认放行匿名连接。改为显式认证（内置库 + bootstrap 种子）+
      # 文件授权器（设备按 clientId 隔离到 cabinet/{deviceId}/#，未匹配一律拒绝）。
      # 口令由 scripts/gen-emqx-auth-bootstrap.ps1 从 .env.production 生成
      # docker/emqx/auth-bootstrap.production.csv（已 gitignore，勿提交）。
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/aicabinet-auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/aicabinet-acl.conf
    volumes:
      - ./docker/emqx/aicabinet-acl.conf:/opt/emqx/etc/aicabinet-acl.conf:ro
      - ./docker/emqx/auth-bootstrap.production.csv:/opt/emqx/etc/aicabinet-auth-bootstrap.csv:ro

  minio:
    environment:
      # B-11：强制强密码，无弱默认
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  # B-28：Grafana 禁止 admin/admin 弱默认
  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

  # B-25：XXL-JOB 生产强口令（需叠加 docker-compose.xxljob.yml）
  xxl-job-mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:?set XXL_JOB_MYSQL_PASSWORD}

  xxl-job-admin:
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:?set XXL_JOB_MYSQL_PASSWORD} --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN}"
