# 生产 Compose 叠加层 — 配合 deploy-production.ps1
# 用法：
#   docker compose -p ai-cabinet \
#     -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.production.yml \
#     [-f docker-compose.xxljob.yml] \
#     --env-file .env.production --profile apps up -d --build

services:
  trade-service:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 宽限只给时间窗，真正不硬断在飞请求要 graceful：SIGTERM 后先拒新请求、等在途处理完再退。
      # 25s < stop_grace_period 30s，留 5s 给连接池/Redisson 收尾，避免被 SIGKILL。
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: ${SHUTDOWN_PHASE_TIMEOUT:-25s}
      AICABINET_STAGING_MODE: "false"
      AICABINET_MOCK_ENABLED: "false"
      AICABINET_SECURITY_MOCK_ENABLED: "false"
      # P2：生产 HTTPS 下会话 Cookie 必须 Secure（validator 亦有强校验）
      # Cookie 会话安全属性生产必填显式声明（HTTPS 未就绪的过渡期可 false，见 DEPLOYMENT_CHECKLIST）
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?set AUTH_COOKIE_SECURE (true after HTTPS / false interim) in .env.production}
      # 入口协议声明（validator 以此判定 cookie 阶段：https⇒SECURE 必须 true；http⇒必须 false）
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL (https://domain after HTTPS / http://IP interim) in .env.production}
      # V1：生产每日对账与退款 PROCESSING 推进必须启用（此前默认 false=永不执行）
      RECON_SCHEDULED_ENABLED: "true"
      # L2-4：生产 Redis 强口令必填
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      # X2：环境层钉死支付/分账/提现 mock（validator 另有强校验，双保险）
      PAYSCORE_MOCK_ENABLED: "false"
      PROFIT_SHARING_MOCK_ENABLED: "false"
      LINE_WITHDRAW_MOCK_ENABLED: "false"
      MERCHANT_WITHDRAW_MOCK_ENABLED: "false"
      # 对账 mock 钉死 false：mock 开启时 fetchBill 用账本自身数据伪装通道账单，对账形同虚设
      # （apps.yml 兜底默认为 true，此处必须显式钉死；prod profile 亦硬编码 false，双保险）
      RECON_MOCK_ENABLED: "false"
      # B-6：生产须显式配置内部 API CIDR
      INTERNAL_API_ALLOWED_CIDRS: ${INTERNAL_API_ALLOWED_CIDRS:?set INTERNAL_API_ALLOWED_CIDRS in .env.production}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN in .env.production}
      # 支付阶段模式：生产必须显式声明支付/小程序开关（true 需全套 V3 凭据，validator 硬校验）
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:?set WECHAT_PAY_ENABLED (true=requires full V3 creds / false=no-payment stage)}
      WECHAT_MINIAPP_ENABLED: ${WECHAT_MINIAPP_ENABLED:?set WECHAT_MINIAPP_ENABLED in .env.production}
      # M12 监控接线（2026-10-13 生产实证：trade 缺省探测 localhost ⇒ DevOps 中心恒「未启动」）：
      # health 探测走容器网络内服务名；展示 URL 走网关同源子路径（nginx.compose.conf 反代+Basic，AU-187）
      DEVOPS_GRAFANA_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.production}/devops/grafana
      DEVOPS_GRAFANA_HEALTH_URL: http://grafana:3000
      DEVOPS_PROMETHEUS_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.production}/devops/prometheus
      # health 探针基址也要带子路径：--web.route-prefix 生效后 /-/ready 挂在子路径下
      DEVOPS_PROMETHEUS_HEALTH_URL: http://prometheus:9090/devops/prometheus
      # 链路追踪出口（observability 栈的 tempo；留空=关闭，2026-10-13 起生产开启）
      OTLP_ENDPOINT: http://tempo:4318/v1/traces

  device-service:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 链路追踪出口（observability 栈的 tempo，与 trade 同步开启）
      OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MQTT_BROKER: ${MQTT_BROKER:-ssl://emqx:8883}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME (aicabinet-backend) in .env.production}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env.production}
      # M20：device 与 trade 同样强制显式内部 API CIDR
      INTERNAL_API_ALLOWED_CIDRS: ${INTERNAL_API_ALLOWED_CIDRS:?set INTERNAL_API_ALLOWED_CIDRS in .env.production}
      INTERNAL_API_TRUSTED_PROXY_CIDRS: ${INTERNAL_API_TRUSTED_PROXY_CIDRS:-}
      # L2-4：device 与 trade 同样强制显式 Redis 密码
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      # P2-10 过渡豁免（2026-10-13）：true=允许明文 tcp://（设备接入前必须落地 TLS 并删除）
      MQTT_ALLOW_TCP: ${MQTT_ALLOW_TCP:-}
      # 生产要求每部署唯一 clientId（validator 硬校验，缺省 device-service 会被拒）
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:?set MQTT_CLIENT_ID (unique per deployment) in .env.production}

  # AU-075：jiangyi-gateway 生产段（此前 prod 叠加层完全无此服务——恒跑 dev profile、
  # CIDR 不显式注入、JIANGYI_* 无声明位）。gateway 的 ProductionStartupValidator 在
  # prod/staging 硬拒 dev key / 空 CIDR / 缺失或占位 JWT secret；compose 层用 :? 双保险。
  jiangyi-gateway:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      INTERNAL_API_ALLOWED_CIDRS: ${INTERNAL_API_ALLOWED_CIDRS:?set INTERNAL_API_ALLOWED_CIDRS in .env.production}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
      # 设备 token 签发密钥：空=validator 拒启（运行期 503 fail-closed 语义保留在 dev）
      JIANGYI_JWT_SECRET: ${JIANGYI_JWT_SECRET:?set JIANGYI_JWT_SECRET (>=32 chars) in .env.production}
      JIANGYI_TOKEN_TTL_SECONDS: ${JIANGYI_TOKEN_TTL_SECONDS:-604800}
      # OSS STS 直传（CB-024）：视频上传链路真机接入必填（未配置时运行期 503，不阻断启动）
      JIANGYI_OSS_ACCESS_KEY_ID: ${JIANGYI_OSS_ACCESS_KEY_ID:-}
      JIANGYI_OSS_ACCESS_KEY_SECRET: ${JIANGYI_OSS_ACCESS_KEY_SECRET:-}
      JIANGYI_OSS_ROLE_ARN: ${JIANGYI_OSS_ROLE_ARN:-}
      JIANGYI_OSS_REGION: ${JIANGYI_OSS_REGION:-cn-shenzhen}
      JIANGYI_OSS_BUCKET: ${JIANGYI_OSS_BUCKET:-ai-cabinet-by}
      # 回调将邑商户云所需的租户凭据（收尾E）；与 trade 侧同名键同源
      JIANGYI_TENANT_ID: ${JIANGYI_TENANT_ID:-0}
      JIANGYI_SECRET: ${JIANGYI_SECRET:-}
      JIANGYI_API_BASE_URL: ${JIANGYI_API_BASE_URL:-https://lingshouapi.hunanjysmart.com}
      # 域名自钉（设计文档 §5 拍板 A）：设备轮询 domainConfig 时按此值回钉我方网关。
      # 留空 ⇒ 两个 domainConfig 端点一起 404（不钉）。生产必须填固定公网域名（勿用穿透域名）。
      JIANGYI_PUBLIC_BASE_URL: ${JIANGYI_PUBLIC_BASE_URL:-}

  emqx:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    stop_grace_period: 30s
    image: emqx/emqx:5.8.6
    environment:
      # B-11(v2)：EMQX 5 没有 allow_anonymous / EMQX_AUTH__USER__* 这些 4.x 键，写了对 5.x 无效——
      # 且 5.x 未配置任何认证器时默认放行匿名连接。改为显式认证（内置库 + bootstrap 种子）+
      # 文件授权器（设备按 clientId 隔离到 cabinet/{deviceId}/#，未匹配一律拒绝）。
      # 口令由 scripts/gen-emqx-auth-bootstrap.ps1 从 .env.production 生成
      # docker/emqx/auth-bootstrap.production.csv（已 gitignore，勿提交）。
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/aicabinet-auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/aicabinet-acl.conf
    volumes:
      - ./docker/emqx/aicabinet-acl.conf:/opt/emqx/etc/aicabinet-acl.conf:ro
      - ./docker/emqx/auth-bootstrap.production.csv:/opt/emqx/etc/aicabinet-auth-bootstrap.csv:ro
    ports:
      # 审计 P2-11：显式端口策略（原缺省=继承 base 层回环，真机接入必然手改、无门禁看护）。
      # 设备 MQTT：TCP 1883 仅供不支持 TLS 的柜机过渡——绑业务网卡（env 可覆盖绑定地址）；
      # TLS 8883 为目标形态（需先落地 truststore 供给链，见审计 P2-10）。
      # Dashboard 18083 只许回环（运维本机访问，绝不暴露）。
      # 轮换提醒（P1-6）：改凭据后必须 up -d --force-recreate emqx，restart 不会重导 bootstrap。
      - "${EMQX_MQTT_BIND:-127.0.0.1}:${EMQX_MQTT_PORT:-11883}:1883"
      - "${EMQX_MQTT_TLS_BIND:-127.0.0.1}:${EMQX_MQTT_TLS_PORT:-18883}:8883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-18083}:18083"

  minio:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      # B-11：强制强密码，无弱默认
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # 指标端点公开（与 full.yml 同款）：Prometheus 抓取桶容量/对象数；端口仅 127.0.0.1 映射
      MINIO_PROMETHEUS_AUTH_TYPE: public

  # B-28：Grafana 禁止 admin/admin 弱默认
  grafana:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 唯一管理员（用户实证 2026-10-13）：iframe 每隔几天要重登 Grafana 太烦 ⇒
      # 匿名放行为 Viewer，过网关 Basic 即可直接看板；管理操作仍显式登 admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # M12 监控接线（2026-10-13 生产实证：缺这三项 ⇒ 网关子路径 404/iframe 拒嵌）：
      # 同源子路径 /devops/grafana/（nginx.compose.conf 反代 + Basic，AU-187），允许后台 iframe 嵌入
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.production}/devops/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # 生产 prometheus 挂了 --web.route-prefix=/devops/prometheus/，数据源查询必须带前缀
      #（裸 /api/v1/query 404，2026-10-13 生产实证「开门成功率」面板报错）
      GRAFANA_PROMETHEUS_URL: http://prometheus:9090/devops/prometheus

  # M12 监控接线：Prometheus 挂到同源子路径 /devops/prometheus/（网关 Basic 防护），
  # 指标端点不直接暴露公网端口（base 层仅 127.0.0.1:9090）
  prometheus:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    # 常驻型 ≥30s（check:compose-stop-grace）：SIGTERM 后完成 TSDB 内存块落盘与 WAL 收尾
    stop_grace_period: 30s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.route-prefix=/devops/prometheus/
      - --web.external-url=${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.production}/devops/prometheus/

  # B-25：XXL-JOB 生产强口令（需叠加 docker-compose.xxljob.yml）
  xxl-job-mysql:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    # 2026-10-13 生产首启实证：本文件单独叠加（不叠 xxljob.yml）时这两服务既无 image 又挂
    # apps profile ⇒ compose 结构非法。补 image + 收进 xxljob profile（未叠加 xxljob.yml
    # 时不激活，结构合法；叠加时与 xxljob.yml 同镜像合并）。
    image: mysql:8.0
    profiles: ["xxljob"]
    stop_grace_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: ${XXL_JOB_MYSQL_PASSWORD:?set XXL_JOB_MYSQL_PASSWORD}

  xxl-job-admin:
    # AU-148（批次 10）：常驻服务重启自愈——宿主重启后入口/依赖自动拉起
    restart: unless-stopped
    image: xuxueli/xxl-job-admin:3.4.2
    profiles: ["xxljob"]
    stop_grace_period: 30s
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://xxl-job-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=${XXL_JOB_MYSQL_PASSWORD:?set XXL_JOB_MYSQL_PASSWORD} --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?set XXL_JOB_ACCESS_TOKEN}"
