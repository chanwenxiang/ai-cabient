name: ai-cabinet

# 基础设施层（生产/预发与 docker-compose.apps.yml 叠加使用）。
# 本地开发请只用仓库根目录 .\docker-up.ps1（docker-compose.full.yml），勿单独 up 本文件。

services:
  postgres:
    stop_grace_period: 60s
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicabinet
      POSTGRES_USER: aicabinet
      POSTGRES_PASSWORD: aicabinet
    mem_limit: 1g
    cpus: 1.0
    ports:
      # Host port avoids Windows Hyper-V reserved range ~5433–5532. 仅回环：开发库不暴露局域网。
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    stop_grace_period: 30s
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  emqx:
    stop_grace_period: 30s
    image: emqx/emqx:5.8.6
    restart: unless-stopped
    ports:
      # Host ports avoid Windows Hyper-V reserved range ~1822–1921 (includes 1883/8883/18083).
      # 开发栈仅绑定回环：避免匿名弱凭据的 MQTT/MinIO 等暴露到局域网（生产走 production compose）。
      - "127.0.0.1:${EMQX_MQTT_PORT:-11883}:1883"
      - "127.0.0.1:${EMQX_MQTT_TLS_PORT:-18883}:8883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-28083}:18083"
    environment:
      # 认证：内置数据库 + bootstrap 种子（5.8+ 支持）。EMQX 5 无 allow_anonymous 键，
      # 配置了认证器后无凭据连接一律拒绝。
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/aicabinet-auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      # 授权：设备按 clientId 隔离到 cabinet/{deviceId}/#，未匹配一律拒绝
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/aicabinet-acl.conf
    volumes:
      - ./docker/emqx/aicabinet-acl.conf:/opt/emqx/etc/aicabinet-acl.conf:ro
      - ./docker/emqx/auth-bootstrap.dev.csv:/opt/emqx/etc/aicabinet-auth-bootstrap.csv:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5

  minio:
    stop_grace_period: 60s
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Host defaults; on Windows if 9000–9039 is Hyper-V reserved, use
      # docker-compose.win-ports.yml (19000/19001) or set MINIO_API_PORT / MINIO_CONSOLE_PORT. 仅回环。
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 0.5

  redpanda:
    stop_grace_period: 60s
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"

  gateway:
    stop_grace_period: 30s
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    stop_grace_period: 30s
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      # 仅回环：指标端点含内部拓扑信息，不暴露局域网/公网
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m
    cpus: 0.5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    stop_grace_period: 30s
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    profiles: ["apps"]
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
