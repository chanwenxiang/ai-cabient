name: ai-cabinet

# 基础设施层（生产/预发与 docker-compose.apps.yml 叠加使用）。
# 本地开发请只用仓库根目录 .\docker-up.ps1（docker-compose.full.yml），勿单独 up 本文件。

services:
  postgres:
    stop_grace_period: 60s
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # AU-192：钉 digest（= 2026-10 本地实测版）
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicabinet
      POSTGRES_USER: aicabinet
      # 审计 P2-21：读 env（dev 缺省不变）——原硬编码令 .env 里的 POSTGRES_PASSWORD 静默失效
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicabinet}
    mem_limit: 1g
    cpus: 1.0
    ports:
      # Host port avoids Windows Hyper-V reserved range ~5433–5532. 仅回环：开发库不暴露局域网。
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    stop_grace_period: 30s
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 # 钉 digest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # L2-4：Redis 启用密码（dev 默认 devredis，production overlay 强制 :? 强口令）；
    # 使用方经 SPRING_DATA_REDIS_PASSWORD / REDIS_PASSWORD 对齐，忘记配会让依赖服务启动即报错（fail-loud）。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    # AOF 持久化必须落卷：否则容器重建即丢 captcha/幂等键等状态（2026-10-16 审计 A5）
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  emqx:
    stop_grace_period: 30s
    image: emqx/emqx:5.8.6@sha256:a1e3d10fa1dcc8c94325b815a93b5b5974253a97cb36470b44e47d5d3ef9cd13 # 钉 digest
    restart: unless-stopped
    ports:
      # Host ports avoid Windows Hyper-V reserved range ~1822–1921 (includes 1883/8883/18083).
      # 开发栈仅绑定回环：避免匿名弱凭据的 MQTT/MinIO 等暴露到局域网（生产走 production compose）。
      - "127.0.0.1:${EMQX_MQTT_PORT:-11883}:1883"
      - "127.0.0.1:${EMQX_MQTT_TLS_PORT:-18883}:8883"
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-28083}:18083"
    environment:
      # 认证：内置数据库 + bootstrap 种子（5.8+ 支持）。EMQX 5 无 allow_anonymous 键，
      # 配置了认证器后无凭据连接一律拒绝。
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
      EMQX_AUTHENTICATION__1__BOOTSTRAP_FILE: /opt/emqx/etc/aicabinet-auth-bootstrap.csv
      EMQX_AUTHENTICATION__1__BOOTSTRAP_TYPE: plain
      # 授权：设备按 clientId 隔离到 cabinet/{deviceId}/#，未匹配一律拒绝
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: file
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      EMQX_AUTHORIZATION__SOURCES__1__PATH: /opt/emqx/etc/aicabinet-acl.conf
    volumes:
      - ./docker/emqx/aicabinet-acl.conf:/opt/emqx/etc/aicabinet-acl.conf:ro
      - ./docker/emqx/auth-bootstrap.dev.csv:/opt/emqx/etc/aicabinet-auth-bootstrap.csv:ro
      # AU-189：EMQX 数据卷——重启丢内置库 ⇒ 设备凭据变更/用户态不生效（bootstrap CSV 仅首启导入）
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5

  minio:
    stop_grace_period: 60s
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e # 审计批次4：钉 digest（原 latest；= 2026-10 本地实测版）
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 审计 P2-22：读 env（dev 缺省不变）——原硬编码令 .env 里的 MINIO_ROOT_PASSWORD 静默失效
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Host defaults; on Windows if 9000–9039 is Hyper-V reserved, use
      # docker-compose.win-ports.yml (19000/19001) or set MINIO_API_PORT / MINIO_CONSOLE_PORT. 仅回环。
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 0.5

  redpanda:
    stop_grace_period: 60s
    image: redpandadata/redpanda:v24.1.1@sha256:3387a7ac6b2307129032562bf957653de13373a2748f82de7ab588a39d50b88d # 钉 digest
    # 审计 A2/P1-8：SASL/SCRAM 基线——配置文件挂载渲染（authentication_method 必须显式写在
    # 监听器上；--set/--kafka-addr 旗标写法实证不可靠，见 redpanda.sasl.yaml 头注释）。
    # 本 base 栈默认宣告 localhost（宿主工具直连）；apps 叠加时以 REDPANDA_ADVERTISE=redpanda 覆盖。
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sed "s/__ADVERTISE__/$${REDPANDA_ADVERTISE:-localhost}/g" /redpanda-tmpl/redpanda.sasl.yaml > /etc/redpanda/redpanda.yaml
        exec /usr/bin/rpk redpanda start --smp 1 --memory 512M --overprovisioned
    environment:
      REDPANDA_ADVERTISE: ${REDPANDA_ADVERTISE:-localhost}
    volumes:
      - ./redpanda/redpanda.sasl.yaml:/redpanda-tmpl/redpanda.sasl.yaml:ro
      # AU-189：redpanda 数据卷——重启丢 offset/主题
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:9092:9092"

  # 一次性 SCRAM 用户引导（幂等）：trade 消费/生产 + admin。
  # enable_sasl 为集群配置属性（v24 --set 静态写法无效），运行时设置；不阻断栈启动。
  redpanda-init:
    stop_grace_period: 30s
    image: redpandadata/redpanda:v24.1.1@sha256:3387a7ac6b2307129032562bf957653de13373a2748f82de7ab588a39d50b88d # 钉 digest
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set +e
        for i in $$(seq 1 30); do
          rpk cluster health --api-urls redpanda:9644 >/dev/null 2>&1 && break
          sleep 2
        done
        rpk cluster config set enable_sasl true --api-urls redpanda:9644 \
          || echo "[init] enable_sasl already set or failed"
        rpk cluster config set superusers '["admin","trade"]' --api-urls redpanda:9644 \
          || echo "[init] superusers already set or failed"
        rpk acl user create trade -p "$$KAFKA_TRADE_PASSWORD" --api-urls redpanda:9644 \
          || echo "[init] trade user exists or create failed"
        rpk acl user create admin -p "$$KAFKA_ADMIN_PASSWORD" --api-urls redpanda:9644 \
          || echo "[init] admin user exists or create failed"
        echo "[init] done"
    environment:
      KAFKA_TRADE_PASSWORD: ${KAFKA_TRADE_PASSWORD:-dev-kafka-trade}
      KAFKA_ADMIN_PASSWORD: ${KAFKA_ADMIN_PASSWORD:-dev-kafka-admin}
    depends_on:
      - redpanda

  gateway:
    stop_grace_period: 30s
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2 # 钉 digest
    ports:
      - "80:80" # EXPOSE-ALLOW: gateway 业务入口（base 栈对外唯一 HTTP）
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    stop_grace_period: 30s
    image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f # 钉 digest
    restart: unless-stopped
    ports:
      # 仅回环：指标端点含内部拓扑信息，不暴露局域网/公网
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # AU-189：prometheus 数据卷——重启丢告警历史与时序
      - prometheus-data:/prometheus
    mem_limit: 512m
    cpus: 0.5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    stop_grace_period: 30s
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5 # 钉 digest
    restart: unless-stopped
    profiles: ["apps"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # datasource provisioning 模板变量（prometheus.yml 的 url: $GRAFANA_PROMETHEUS_URL）
      GRAFANA_PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
      # AU-189：grafana 数据卷——重启丢仪表盘编辑与数据源改动
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  redisdata:
  # AU-189：观测/消息中间件持久化
  prometheus-data:
  grafana-data:
  redpanda-data:
  emqx-data:
