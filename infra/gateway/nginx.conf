upstream trade_service {
    server host.docker.internal:8080;
}

server {
    listen 80;
limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=device_ratelimit:10m rate=100r/s;

limit_req_status 429;

    server_name _;

    client_max_body_size 20m;

    location /api/v2/ {
        limit_req zone=api_ratelimit burst=50 nodelay;
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /o/ {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
    }

    location /api/v2/auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /admin {
        return 302 /admin/;
    }

    location = /admin/index.html {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /admin/ {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /actuator/ {
        proxy_pass http://trade_service;
    }

    location /internal/ {
        return 403;
    }

    location / {
        return 302 /admin/;
    }
}

