limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=device_ratelimit:10m rate=100r/s;
limit_req_status 429;

upstream trade_service {
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/v2/ {
        limit_req zone=api_ratelimit burst=50 nodelay;
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /o/ {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
    }

    # 图形验证码是登录页的**只读前置资源**（GET、无副作用）：它取不到 = 登录入口直接不可用。
    # 若与写端点共用 auth_ratelimit（5r/s）且按 $binary_remote_addr 计数，同一出口 IP
    # （商场 WiFi / 运营商 NAT）下的并发登录会把验证码打成 429，用户侧表现为「登录页打不开」。
    # 故单独拆到 api_ratelimit（30r/s）：不新增可被滥用的能力，但不再阻断登录入口。
    # 真正有滥用成本的端点（sms-code = 真实短信费用、login/password-login = 撞库）仍留严格档，
    # 且服务端另有 SmsCodeService 的手机号冷却 + 小时上限兜底。
    location = /api/v2/auth/captcha {
        limit_req zone=api_ratelimit burst=50 nodelay;
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 登录等认证写端点更严格限流，防撞库与验证码爆破
    location /api/v2/auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /admin {
        return 302 /admin/;
    }

    location = /admin/index.html {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

      # 哈希静态资源（assets/ 下带内容哈希）可一年强缓存
      location ~* ^/admin/assets/ {
          proxy_pass http://trade_service;
          proxy_set_header Host $host;
          expires 1y;
          add_header Cache-Control "public, immutable" always;
      }
      location /admin/ {
          proxy_pass http://trade_service;
          proxy_set_header Host $host;
          proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # 生产只允许健康检查探针访问 /actuator/health、/actuator/info；
    # prometheus 由内网 Prometheus 直连服务端口抓取，不经过公网网关。
    location = /actuator/health {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /actuator/info {
        proxy_pass http://trade_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /actuator/ {
        return 403;
    }

    location /internal/ {
        return 403;
    }

    location / {
        return 302 /admin/;
    }
}

