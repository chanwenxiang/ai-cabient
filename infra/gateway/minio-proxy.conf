map $http_upgrade $minio_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9000;
    server_tokens off;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s ipv6=off;

    if ($http_x_amz_content_sha256 = "STREAMING-UNSIGNED-PAYLOAD-TRAILER") {
        return 403;
    }

    set $minio_api minio:9000;
    location / {
        proxy_pass http://$minio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $minio_connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 9001;
    server_tokens off;
    client_max_body_size 0;
    resolver 127.0.0.11 valid=10s ipv6=off;

    if ($http_x_amz_content_sha256 = "STREAMING-UNSIGNED-PAYLOAD-TRAILER") {
        return 403;
    }

    set $minio_console minio:9001;
    location / {
        proxy_pass http://$minio_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $minio_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
