global
  maxconn 1024

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s

defaults
  mode http
  retries 0
  option dontlognull
  timeout connect 2s
  timeout client 120s
  timeout server 120s
  timeout check 1s

frontend trade_frontend
  bind *:8080
  default_backend trade_backend

backend trade_backend
  balance roundrobin
  option httpchk
  http-check send meth GET uri /actuator/health
  http-check expect status 200
  server-template trade 4 trade-service:8080 check resolvers docker resolve-prefer ipv4 inter 500ms fall 1 rise 1
