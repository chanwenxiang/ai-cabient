limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 管理后台前端由宿主机构建产物直接托管（infra/docker-compose.full.yml 挂载）
    root /usr/share/nginx/html;

    # Docker 内置 DNS：容器重建后 IP 会变，静态 upstream 会导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v2/ {
        limit_req zone=api_ratelimit burst=50 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 图形验证码是登录页的**只读前置资源**（GET、无副作用）：它取不到 = 登录入口直接不可用。
    # 若与写端点共用 auth_ratelimit（5r/s）且按 $binary_remote_addr 计数，同一出口 IP
    # （商场 WiFi / 运营商 NAT）下的并发登录会把验证码打成 429，用户侧表现为「登录页打不开」。
    # 故单独拆到 api_ratelimit（30r/s）：不新增可被滥用的能力，但不再阻断登录入口。
    # 真正有滥用成本的端点（sms-code = 真实短信费用、login/password-login = 撞库）仍留严格档，
    # 且服务端另有 SmsCodeService 的手机号冷却 + 小时上限兜底。
    location = /api/v2/auth/captcha {
        limit_req zone=api_ratelimit burst=50 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 登录等认证写端点更严格限流，防撞库与验证码爆破
    location /api/v2/auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /o/ {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location = /admin { return 302 /admin/; }
    # 微信「扫普通链接二维码打开小程序」域名校验文件：文件名以 MP 后台下载为准
    # （形如 MP_verify_*.txt），必须能以 https://{域名}/{文件名} 200 直出，
    # 不能落到下方 location / 的 302 /admin/。文件置于 /usr/share/nginx/html/（容器内）。
    # 仅匹配根目录单段 .txt（不含子路径），不干扰 /api/v2/ 等前缀路由。
    location ~ ^/[^/]+\.txt$ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
    # 微信「扫普通链接二维码」校验文件要求放在**二维码规则前缀**下：
    # https://{域名}/o/{文件名}.txt（2026-10-21 实证：仅根目录直出不满足，微信检查 /o/ 下）。
    # 正则优先于 /o/ 前缀的 proxy_pass；文件置于容器内 /usr/share/nginx/html/o/。
    location ~ ^/o/[A-Za-z0-9_-]+\.txt$ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
    location = /admin/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
      # 哈希静态资源（assets/ 下带内容哈希）可一年强缓存
      location ~* ^/admin/assets/ {
          expires 1y;
          add_header Cache-Control "public, immutable" always;
          try_files $uri =404;
      }
      location /admin/ {
          index index.html;
          try_files $uri $uri/ /admin/index.html;
          add_header Cache-Control "no-store, no-cache, must-revalidate" always;
          add_header Pragma "no-cache" always;
    }
    # 生产只允许健康检查探针访问 /actuator/health、/actuator/info；
    # prometheus 由内网 Prometheus 直连服务端口抓取，不经过公网网关。
    location = /actuator/health {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location = /actuator/info {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location ^~ /actuator/ {
        return 403;
    }
    # 将邑开门柜设备面 HTTP 上报（CB-022）：保留 /jiangyi/ 前缀转发，
    # setDomain 的 domain = https://<host>/jiangyi/api（设备按 domain+文档路径硬拼）
    location /jiangyi/ {
        set $jiangyi_upstream jiangyi-gateway:8083;
        proxy_pass http://$jiangyi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 将邑设备 WS 长连接（wss://<host>/websocket/device/{identifier}?token=）：
    # 长读超时 3600s（方案 §8）；Upgrade/Connection 头用文件头部的 $connection_upgrade map
    location /websocket/ {
        # 设备侧 WS 基地址可能带重复斜杠（2026-10-20 实测 /device//SN → Spring 404）：
        # proxy_pass 不带 URI 会转发原始请求行，这里显式转发已合并斜杠的 $uri
        set $jiangyi_upstream jiangyi-gateway:8083;
        proxy_pass http://$jiangyi_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }

    location /internal/ { return 403; }

    # 裸路径（无尾斜杠）301 到子路径入口，避免 DevOps 中心卡片「新窗口打开」落到 404
    location = /devops/grafana { return 308 /devops/grafana/; }
    location = /devops/prometheus { return 308 /devops/prometheus/graph; }

    location /devops/grafana/ {
        # V2/V3：与 nginx.compose.conf 同款 Basic（账号见 gateway/grafana.htpasswd），
        # Grafana 自身登录（M12 关匿名）之上再加一层网关防护。
        auth_basic "Grafana Admin";
        auth_basic_user_file /etc/nginx/grafana.htpasswd;
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 浏览器带的是网关 Basic 凭据（cwx，Grafana 里无此用户）——透传会让 Grafana
        # 每个请求都记一条 INFO "Failed to authenticate request"（2026-10-13 生产实证刷屏，
        # 且被日志看板旧口径误计为错误）。网关层鉴权后即剥离，Grafana 走自身会话 Cookie。
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 120s;
    }

    # Prometheus 同源子路径（容器 --web.route-prefix=/devops/prometheus/，无需 rewrite）
    location /devops/prometheus/ {
        auth_basic "Grafana Admin";
        auth_basic_user_file /etc/nginx/grafana.htpasswd;
        set $prometheus_upstream prometheus:9090;
        proxy_pass http://$prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 120s;
    }

    location / { return 302 /admin/; }
}
