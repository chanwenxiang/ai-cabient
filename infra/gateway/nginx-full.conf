limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 管理后台前端由宿主机构建产物直接托管（infra/docker-compose.full.yml 挂载）
    root /usr/share/nginx/html;

    # Docker 内置 DNS：容器重建后 IP 会变，静态 upstream 会导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v2/ {
        limit_req zone=api_ratelimit burst=50 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 登录/验证码等认证端点更严格限流，防撞库与验证码爆破
    location /api/v2/auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /o/ {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location = /admin { return 302 /admin/; }
    location = /admin/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }
      # 哈希静态资源（assets/ 下带内容哈希）可一年强缓存
      location ~* ^/admin/assets/ {
          expires 1y;
          add_header Cache-Control "public, immutable" always;
          try_files $uri =404;
      }
      location /admin/ {
          index index.html;
          try_files $uri $uri/ /admin/index.html;
          add_header Cache-Control "no-store, no-cache, must-revalidate" always;
          add_header Pragma "no-cache" always;
    }
    # 生产只允许健康检查探针访问 /actuator/health、/actuator/info；
    # prometheus 由内网 Prometheus 直连服务端口抓取，不经过公网网关。
    location = /actuator/health {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location = /actuator/info {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    location ^~ /actuator/ {
        return 403;
    }
    location /internal/ { return 403; }
    location / { return 302 /admin/; }
}
