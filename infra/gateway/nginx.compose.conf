limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v2/ {
        limit_req zone=api_ratelimit burst=50 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # 登录/验证码等认证端点更严格限流，防撞库与验证码爆破
    location /api/v2/auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /o/ {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /admin {
        return 302 /admin/;
    }

    # index.html 禁止缓存，避免部署后仍引用旧的 hashed chunk 导致白屏/登录异常
    location = /admin/index.html {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

      # 哈希静态资源（assets/ 下带内容哈希）可一年强缓存
      location ~* ^/admin/assets/ {
          set $trade_upstream trade-service:8080;
          proxy_pass http://$trade_upstream;
          proxy_set_header Host $host;
          expires 1y;
          add_header Cache-Control "public, immutable" always;
          proxy_connect_timeout 10s;
          proxy_read_timeout 120s;
      }
      location /admin/ {
          set $trade_upstream trade-service:8080;
          proxy_pass http://$trade_upstream;
          proxy_set_header Host $host;
          proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        set $trade_upstream trade-service:8080;
        proxy_pass http://$trade_upstream;
    }

    location /internal/ {
        return 403;
    }

    location / {
        return 302 /admin/;
    }
}
