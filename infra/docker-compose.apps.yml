# 全栈 Compose：在 infra/docker-compose.yml 基础上追加应用服务
# 用法：docker compose -f docker-compose.yml -f docker-compose.apps.yml --profile apps up -d --build

services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicabinet -d aicabinet"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        attempt=0
        max=30
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempt=$$((attempt + 1))
          if [ $$attempt -ge $$max ]; then
            echo "minio not ready after $$max attempts"
            exit 1
          fi
          echo "waiting for minio ($$attempt/$$max)..."
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc ilm add --prefix 'sim/' --expire-days "$${MINIO_SIM_RETENTION_DAYS:-7}" "local/$$MINIO_BUCKET" || true
        mc ilm add --prefix 'videos/' --expire-days "$${MINIO_VIDEO_RETENTION_DAYS:-30}" "local/$$MINIO_BUCKET" || true
        mc ilm add --prefix 'archive/' --expire-days "$${MINIO_ARCHIVE_RETENTION_DAYS:-180}" "local/$$MINIO_BUCKET" || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cabinet-videos}
      MINIO_SIM_RETENTION_DAYS: ${MINIO_SIM_RETENTION_DAYS:-7}
      MINIO_VIDEO_RETENTION_DAYS: ${MINIO_VIDEO_RETENTION_DAYS:-30}
      MINIO_ARCHIVE_RETENTION_DAYS: ${MINIO_ARCHIVE_RETENTION_DAYS:-180}
    profiles: ["apps"]

  trade-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/docker/trade-service.Dockerfile
    image: ai-cabinet/trade-service:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aicabinet
      SPRING_DATASOURCE_USERNAME: aicabinet
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aicabinet}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: redpanda:9092
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      VISION_API_KEY: ${VISION_API_KEY}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      AICABINET_DEVICE_SERVICE_URL: http://device-service:8081
      AICABINET_VISION_SERVICE_URL: http://vision-service:8082
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cabinet-videos}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      CHECKOUT_BALANCE_ONLY: ${CHECKOUT_BALANCE_ONLY:-false}
      PAYSCORE_ENABLED: ${PAYSCORE_ENABLED:-false}
      PAYSCORE_MOCK_ENABLED: ${PAYSCORE_MOCK_ENABLED:-true}
      PAYSCORE_LIVE_CHARGE_ENABLED: ${PAYSCORE_LIVE_CHARGE_ENABLED:-false}
      PAYSCORE_MIN_SCORE: ${PAYSCORE_MIN_SCORE:-550}
      PAYSCORE_CHARGE_GATEWAY_URL: ${PAYSCORE_CHARGE_GATEWAY_URL:-}
      PAYSCORE_CHARGE_GATEWAY_API_KEY: ${PAYSCORE_CHARGE_GATEWAY_API_KEY:-}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_MCH_SERIAL: ${WECHAT_MCH_SERIAL:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_PLATFORM_CERT: ${WECHAT_PLATFORM_CERT:-}
      WECHAT_PLATFORM_CERT_AUTO_FETCH: ${WECHAT_PLATFORM_CERT_AUTO_FETCH:-true}
      WECHAT_MINIAPP_ID: ${WECHAT_MINIAPP_ID:-}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET:-}
      PROFIT_SHARING_ENABLED: ${PROFIT_SHARING_ENABLED:-false}
      PROFIT_SHARING_MOCK_ENABLED: ${PROFIT_SHARING_MOCK_ENABLED:-false}
      PROFIT_SHARING_RETRY_ENABLED: ${PROFIT_SHARING_RETRY_ENABLED:-true}
      PROFIT_SHARING_RETRY_BATCH_SIZE: ${PROFIT_SHARING_RETRY_BATCH_SIZE:-20}
      # 提现手续费演示默认：固定 0.5 元 + 0.5%；生产请显式覆盖为 0 或真实费率
      MERCHANT_WITHDRAW_FEE_CENTS: ${MERCHANT_WITHDRAW_FEE_CENTS:-50}
      MERCHANT_WITHDRAW_FEE_BPS: ${MERCHANT_WITHDRAW_FEE_BPS:-50}
      LINE_WITHDRAW_FEE_CENTS: ${LINE_WITHDRAW_FEE_CENTS:-50}
      LINE_WITHDRAW_FEE_BPS: ${LINE_WITHDRAW_FEE_BPS:-50}
      # Spring 绑定 aicabinet.security.mock-enabled ← AICABINET_MOCK_ENABLED
      AICABINET_MOCK_ENABLED: ${AICABINET_MOCK_ENABLED:-true}
      AICABINET_SECURITY_MOCK_ENABLED: ${AICABINET_MOCK_ENABLED:-true}
      RECON_MOCK_ENABLED: ${RECON_MOCK_ENABLED:-true}
      # 多实例默认开 XXL：资金/对账类由调度中心触发；本地 IDEA 仍可用 XXL_JOB_ENABLED=false
      XXL_JOB_ENABLED: ${XXL_JOB_ENABLED:-true}
      XXL_JOB_ADMIN_ADDRESSES: ${XXL_JOB_ADMIN_ADDRESSES:-http://xxl-job-admin:8080/xxl-job-admin}
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:-}
      XXL_JOB_EXECUTOR_PORT: ${XXL_JOB_EXECUTOR_PORT:-9999}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 1024m
    cpus: 1.5
    profiles: ["apps"]

  device-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/docker/device-service.Dockerfile
    image: ai-cabinet/device-service:${IMAGE_TAG:-latest}
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://emqx:1883}
      AICABINET_TRADE_SERVICE_URL: http://trade-service:8080
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      emqx:
        condition: service_started
      trade-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health 2>/dev/null | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    mem_limit: 768m
    cpus: 1.0
    profiles: ["apps"]

  vision-service:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/docker/vision-service.Dockerfile
    image: ai-cabinet/vision-service:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      MOCK_ENABLED: ${VISION_MOCK_ENABLED:-true}
      RECOGNIZER_BACKEND: ${RECOGNIZER_BACKEND:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-2000}
      DEEPSEEK_AUTO_CHARGE: ${DEEPSEEK_AUTO_CHARGE:-false}
      VISION_FORCE_REAL: ${VISION_FORCE_REAL:-false}
      VISION_API_KEY: ${VISION_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cabinet-videos}
      OBJECT_STORAGE_SCHEME: ${OBJECT_STORAGE_SCHEME:-minio}
      OSS_REGION: ${OSS_REGION:-cn-shanghai}
      TRADE_SERVICE_URL: http://trade-service:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      KAFKA_ENABLED: "false"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      trade-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    mem_limit: 512m
    cpus: 1.0
    profiles: ["apps"]

  redpanda:
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    profiles: ["apps"]

  gateway:
    volumes:
      - ./gateway/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      trade-service:
        condition: service_healthy
      device-service:
        condition: service_healthy
      vision-service:
        condition: service_healthy
    profiles: ["apps"]

  prometheus:
    volumes:
      - ./monitoring/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      trade-service:
        condition: service_started
      device-service:
        condition: service_started
    profiles: ["apps"]
