name: ai-cabinet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aicabinet
      POSTGRES_USER: aicabinet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicabinet}
    ports: ["${POSTGRES_PORT:-15433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicabinet -d aicabinet"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  emqx:
    image: emqx/emqx:5.5
    ports:
      - "${EMQX_MQTT_PORT:-11883}:1883"
      - "${EMQX_MQTT_TLS_PORT:-18883}:8883"
      - "${EMQX_DASHBOARD_PORT:-28083}:18083"
    environment: { EMQX_ALLOW_ANONYMOUS: "true" }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done; mc mb --ignore-existing local/${MINIO_BUCKET:-cabinet-videos}"]

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command: ["redpanda", "start", "--smp", "1", "--memory", "512M", "--overprovisioned", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092"]
    ports: ["9092:9092"]

  vision-service:
    build:
      context: ..
      dockerfile: infra/docker/vision-service.Dockerfile
      args:
        INSTALL_ML: ${VISION_INSTALL_ML:-true}
        SKU_MODEL_FILE: retail-os-v2.0.0.pt
    image: ai-cabinet/vision-service:${IMAGE_TAG:-latest}
    environment:
      MOCK_ENABLED: ${VISION_MOCK_ENABLED:-true}
      VISION_FORCE_REAL: ${VISION_FORCE_REAL:-false}
      YOLO_RECOGNITION_MODE: ${YOLO_RECOGNITION_MODE:-delta}
      HYBRID_DELTA_FIRST: ${HYBRID_DELTA_FIRST:-false}
      MOCK_FORCE_NEED_REVIEW: ${MOCK_FORCE_NEED_REVIEW:-false}
      VISION_API_KEY: ${VISION_API_KEY:-dev-vision-key-change-me}
      TRADE_SERVICE_URL: http://trade-service:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      RECOGNIZER_BACKEND: ${RECOGNIZER_BACKEND:-yolo_deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-2000}
      DEEPSEEK_AUTO_CHARGE: ${DEEPSEEK_AUTO_CHARGE:-false}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/app/models/retail-os-v2.0.0.pt}
      YOLO_MODEL_VERSION: ${YOLO_MODEL_VERSION:-retail-os-v2.0.0}
      YOLO_AUTO_DOWNLOAD: ${YOLO_AUTO_DOWNLOAD:-false}
      YOLO_CONF: ${YOLO_CONF:-0.45}
      YOLO_REVIEW_CONF: ${YOLO_REVIEW_CONF:-0.72}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cabinet-videos}
      KAFKA_ENABLED: "false"
      KAFKA_BOOTSTRAP: redpanda:9092
    volumes:
      - ../vision-service/models:/app/models:ro
    ports: ["18082:8082"]
    depends_on:
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  trade-service:
    build:
      context: ..
      dockerfile: infra/docker/trade-service.Dockerfile
    image: ai-cabinet/trade-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aicabinet
      SPRING_DATASOURCE_USERNAME: aicabinet
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aicabinet}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: redpanda:9092
      AICABINET_DEVICE_SERVICE_URL: http://device-service:8081
      AICABINET_VISION_SERVICE_URL: http://vision-service:8082
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cabinet-videos}
      JWT_SECRET: ${JWT_SECRET:-ai-cabinet-dev-secret-key-32bytes!!}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      VISION_API_KEY: ${VISION_API_KEY:-dev-vision-key-change-me}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AICABINET_STAGING_MODE: ${AICABINET_STAGING_MODE:-false}
      AICABINET_GRAVITY_FALLBACK_SETTLE: ${AICABINET_GRAVITY_FALLBACK_SETTLE:-false}
      AICABINET_MOCK_ENABLED: ${AICABINET_MOCK_ENABLED:-true}
      CHECKOUT_BALANCE_ONLY: ${CHECKOUT_BALANCE_ONLY:-false}
      PAYSCORE_ENABLED: ${PAYSCORE_ENABLED:-false}
      PAYSCORE_MOCK_ENABLED: ${PAYSCORE_MOCK_ENABLED:-true}
      PAYSCORE_LIVE_CHARGE_ENABLED: ${PAYSCORE_LIVE_CHARGE_ENABLED:-false}
      PAYSCORE_MIN_SCORE: ${PAYSCORE_MIN_SCORE:-550}
      PAYSCORE_CHARGE_GATEWAY_URL: ${PAYSCORE_CHARGE_GATEWAY_URL:-}
      PAYSCORE_CHARGE_GATEWAY_API_KEY: ${PAYSCORE_CHARGE_GATEWAY_API_KEY:-}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-}
      # 柜门一码：手机扫码请在 infra/.env 设 QR_PUBLIC_HOST=http://<WLAN局域网IP>（经网关 :80）
      # 容器内 auto 探测到的是 Docker 网桥 IP，不可用；默认 localhost 仅本机浏览器。
      QR_PUBLIC_HOST: ${QR_PUBLIC_HOST:-http://localhost}
      CONSUMER_H5_BASE: ${CONSUMER_H5_BASE:-http://127.0.0.1:3002/}
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_PATH: ${WECHAT_MP_PATH:-pages/index/index}
      WECHAT_MP_ENV: ${WECHAT_MP_ENV:-release}
      WECHAT_MINIAPP_ENABLED: ${WECHAT_MINIAPP_ENABLED:-false}
      WECHAT_MINIAPP_ID: ${WECHAT_MINIAPP_ID:-}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET:-}
      # 微信分账联调（无真实证书时开 Mock）
      PROFIT_SHARING_ENABLED: ${PROFIT_SHARING_ENABLED:-true}
      PROFIT_SHARING_MOCK_ENABLED: ${PROFIT_SHARING_MOCK_ENABLED:-true}
      PROFIT_SHARING_RETRY_ENABLED: ${PROFIT_SHARING_RETRY_ENABLED:-true}
      PROFIT_SHARING_RETRY_BATCH_SIZE: ${PROFIT_SHARING_RETRY_BATCH_SIZE:-20}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_MCH_SERIAL: ${WECHAT_MCH_SERIAL:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
      WECHAT_PLATFORM_CERT: ${WECHAT_PLATFORM_CERT:-}
      WECHAT_PLATFORM_CERT_AUTO_FETCH: ${WECHAT_PLATFORM_CERT_AUTO_FETCH:-true}
    ports: ["18080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
      redpanda: { condition: service_started }
      vision-service: { condition: service_started }
    restart: unless-stopped

  device-service:
    build:
      context: ..
      dockerfile: Dockerfile.java-service
      args: { MODULE: services/device-service }
    environment:
      SERVER_PORT: 8081
      MQTT_BROKER: tcp://emqx:1883
      MQTT_CLIENT_ID: device-service-docker
      AICABINET_TRADE_SERVICE_URL: http://trade-service:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    ports: ["18081:8081"]
    depends_on:
      emqx: { condition: service_started }
      trade-service: { condition: service_started }
    restart: unless-stopped

  device-simulator:
    build: { context: .., dockerfile: edge/device-simulator/Dockerfile }
    command: ["CAB-001", "tcp://emqx:1883"]
    environment:
      TRADE_SERVICE_URL: http://trade-service:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cabinet-videos}
      # 本地全流程演示保留足够的取货观察时间；真实硬件以用户实际关门事件为准。
      AICABINET_SIM_SHOPPING_MS: "${AICABINET_SIM_SHOPPING_MS:-20000}"
      AICABINET_SIM_GRAVITY_JSON: "${AICABINET_SIM_GRAVITY_JSON:-[]}"
      AICABINET_SIM_GRAVITY_SKU: "${AICABINET_SIM_GRAVITY_SKU:-}"
      AICABINET_SIM_GRAVITY_SLOT: A1
      # 顶摄测试图/视频上传 MinIO，供 vision-service 真实 YOLO 识别
      AICABINET_SIM_VIDEO_FILE: "${AICABINET_SIM_VIDEO_FILE:-/testdata/bottle.jpg}"
    volumes:
      - ../testdata:/testdata:ro
    depends_on:
      device-service: { condition: service_started }
      trade-service: { condition: service_started }
      emqx: { condition: service_started }
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./gateway/nginx-full.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [trade-service]

  prometheus:
    image: prom/prometheus:v2.51.0
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus-full.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [trade-service, device-service]

  grafana:
    image: grafana/grafana:10.4.0
    ports: ["${GRAFANA_PORT:-13000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  miniodata:
