# Loki 单机模式配置（filesystem 存储 + 7 天保留）
#
# 用途：收敛全栈容器 stdout 日志（Spring Boot 默认输出到 stdout），
#       由 promtail 抓取后推入 Loki，Grafana 以 Loki 数据源检索。
# 启停：见 infra/observability.ps1（profile=observability，默认不启动）。
#
# 🔴 保留期在这里是**硬约束**：应用侧的 `ops.log_retention.*` 管的是**业务日志表**
#    （通知/积分日志归档），与容器 stdout 的保留是两件事，不要混。
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  # 单机演示栈：7 天。生产按合规要求调整（也可用环境变量注入）。
  retention_period: 168h
  allow_structured_metadata: false
  # 仍是单机演示栈 ⇒ 压小查询内存，避免与业务容器抢内存（Docker VM 2026-09-21 起 8GB）。
  max_query_series: 5000
  max_streams_per_user: 10000
  # 🔴 限速不能按「稳态」拍：promtail **首次启动**会把容器已有日志整体回灌，
  #    默认 3MB/s/流 会被打成 429（条目被丢弃 + promtail 无限重试刷 warning，
  #    现象是「标签都在、就是查不到内容」）。抬高到 8MB/s 让回灌一次过，
  #    真正的兜底是 promtail 侧的 drop.older_than（见 promtail-config.yml）。
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
