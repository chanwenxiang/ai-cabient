global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

# 告警下游：alertmanager（→ feishu-alert-relay → 飞书）。
# 在 docker-compose.full.yml 的 `alerting` profile 下启动；未启动时 prometheus
# 会记录"连不上 alertmanager"的告警——这是**如实反映**，不是故障。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trade-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["trade-service:8080"] }]
  - job_name: device-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["device-service:8081"] }]

  # MinIO 对象存储指标（含各桶容量与对象数）
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{ targets: ["minio:9000"] }]

  # GitHub Actions self-hosted runner 指标（profile devops 启动 runner 后可用，按需扩展）
