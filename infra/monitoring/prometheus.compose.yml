global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: trade-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - trade-service:8080

  - job_name: device-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - device-service:8081

  # MinIO 对象存储指标（含各桶容量与对象数）
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - minio:9000
