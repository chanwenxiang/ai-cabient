global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

# 告警下游：alertmanager（→ feishu-alert-relay → 飞书），见 docker-compose.full.yml 的 alerting profile
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trade-service
    metrics_path: /actuator/prometheus
    # 多副本必须逐 IP 抓取；单服务名目标会把不同实例的指标混成同一条序列。
    dns_sd_configs:
      - names: ["trade-service"]
        type: A
        port: 8080

  - job_name: device-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - device-service:8081

  # MinIO 对象存储指标（含各桶容量与对象数）
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - minio-proxy:9000
