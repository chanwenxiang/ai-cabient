# Track C-admin 隔离被测栈 override —— 与共享 project `ai-cabinet` 同宿主并存、零端口冲突。
# 用法（务必带独立 project 名，命名卷自动隔离出空库，绝不碰 ai-cabinet_pgdata）：
#   docker compose --env-file .env.aicabuat \
#     -f docker-compose.full.yml -f docker-compose.uat-isolated.yml \
#     -p aicabinet-uat up -d
#
# 隔离原理：
#   1. 命名卷（pgdata/redisdata/miniodata/xxljob-mysql-data）按 project 名作用域 ⇒
#      `-p aicabinet-uat` 得到全新空库，Flyway 从 V1 应用到当前头，不挂共享卷。
#   2. 镜像 `IMAGE_TAG=aicabuat` ⇒ 与共享栈的 `local`/`dev` 标签隔离，build 不覆盖他人在跑镜像。
#   3. 本文件用 `!override` 改掉 full.yml 里**硬编码**的 6 个宿主端口；其余宿主端口是
#      `${...PORT:-默认}`，由 `.env.aicabuat` 设错位段避让。服务间调用走容器 DNS（非宿主端口），无需改。
#
# 共享栈实际占用（须避开）：80 6379 9090 11883 13000 15433 18080 18081 18084 18089 18090 19000 19001 19092 18883 28083
services:
  redis:
    stop_grace_period: 30s
    ports: !override
      - "127.0.0.1:26379:6379"
  trade-service:
    stop_grace_period: 30s
    ports: !override
      - "127.0.0.1:28081:8080"
      - "127.0.0.1:${XXL_JOB_EXECUTOR_PORT:-39999}:9999"
  device-service:
    stop_grace_period: 30s
    ports: !override
      - "127.0.0.1:28082:8081"
  jiangyi-gateway:
    stop_grace_period: 30s
    ports: !override
      - "127.0.0.1:28094:8083"
  gateway:
    stop_grace_period: 30s
    ports: !override
      - "127.0.0.1:28080:80"
  prometheus:
    stop_grace_period: 30s
    ports: !override
      - "127.0.0.1:29090:9090"
