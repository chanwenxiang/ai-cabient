# DevOps overlay: SonarQube + GitHub Actions self-hosted runner
# Usage:
#   docker compose -f docker-compose.full.yml -f docker-compose.devops.yml --profile devops up -d

services:
  sonarqube-db:
    stop_grace_period: 60s
    image: postgres:16-alpine
    profiles: ["devops"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - sonarqube_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Community Build 25.x required by official mcp/sonarqube (min SQCB 25.1).
  # Jumping from 10.4 → 25.x: wipe sonarqube_* volumes once (local DevOps only).
  sonarqube:
    stop_grace_period: 30s
    image: sonarqube:25.12.0.117093-community
    profiles: ["devops"]
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONAR_PORT:-19002}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      TZ: Asia/Shanghai
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - ./sonarqube/plugins:/opt/sonarqube/extensions/plugins:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  github-runner:
    stop_grace_period: 30s
    build:
      context: ..
      dockerfile: infra/docker/github-runner.Dockerfile
    image: ai-cabinet/github-runner:${GITHUB_RUNNER_IMAGE_TAG:-2.321.0}
    profiles: ["devops"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REPO_URL: ${GITHUB_REPO_URL:-https://github.com/chanwenxiang/ai-cabient}
      RUNNER_NAME: ${GITHUB_RUNNER_NAME:-ai-cabinet-local}
      # 🔴 这里必须是 PAT（classic，含 repo 作用域）：镜像 entrypoint 会用它在启动时**现取**
      # 注册令牌（ACCESS_TOKEN=… bash /token.sh → RUNNER_TOKEN=$(…| jq -r .token)）。
      # 不要改传 RUNNER_TOKEN —— 那是**一次性注册令牌，1 小时即过期**，过期后容器会以
      # `POST https://api.github.com/actions/runner-registration → 404` 无限重启
      # （2026-09-19 实测 RestartCount=274）。二者与 APP_ID/APP_PRIVATE_KEY 互斥（entrypoint 会报错）。
      ACCESS_TOKEN: ${GITHUB_RUNNER_TOKEN:-}
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: self-hosted,linux,ai-cabinet
      RUNNER_SCOPE: repo
      ORG_NAME: ""
      ENTERPRISE_NAME: ""
    volumes:
      - runner_work:/tmp/runner/work
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
      # 下面两处此前**只存在于手工 `docker run` 起的容器里、不在版本管理内** ⇒ 一旦用 compose
      # 重建就会静默丢失：丢了 Maven 会改走 Maven Central（而非阿里云镜像），CI 构建变慢甚至超时。
      # 默认值取自 2026-09-19 实测的现存挂载；Linux/CI 上用 .env 覆盖即可。
      - ${MAVEN_REPO_HOST_PATH:-D:/devTools/repository}:/root/.m2/repository
      - ${MAVEN_SETTINGS_HOST_PATH:-C:/Users/cwx/.m2/settings-container.xml}:/root/.m2/settings.xml
    # 刻意**不**依赖 sonarqube：runner 的职责是注册并跑 job，注册与监听都不需要 SonarQube。
    # 原先的 `depends_on: sonarqube(condition: service_healthy)` 会让「只想起 runner」变成
    # 必须连带拉起 3GB 的 SonarQube 并等它健康（start_period 180s）——两个 devops 服务被绑死。
    # 需要跑 sonar 扫描时，用同一 profile 单独起 sonarqube 即可。

volumes:
  sonarqube_pg:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  runner_work:
