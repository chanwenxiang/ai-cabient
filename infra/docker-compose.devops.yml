# DevOps overlay: SonarQube + GitHub Actions self-hosted runner
# Usage:
#   docker compose -f docker-compose.full.yml -f docker-compose.devops.yml --profile devops up -d

services:
  sonarqube-db:
    image: postgres:16-alpine
    profiles: ["devops"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - sonarqube_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Community Build 25.x required by official mcp/sonarqube (min SQCB 25.1).
  # Jumping from 10.4 → 25.x: wipe sonarqube_* volumes once (local DevOps only).
  sonarqube:
    image: sonarqube:25.12.0.117093-community
    profiles: ["devops"]
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${SONAR_PORT:-19002}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      TZ: Asia/Shanghai
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - ./sonarqube/plugins:/opt/sonarqube/extensions/plugins:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  github-runner:
    build:
      context: ..
      dockerfile: infra/docker/github-runner.Dockerfile
    image: ai-cabinet/github-runner:${GITHUB_RUNNER_IMAGE_TAG:-2.321.0}
    profiles: ["devops"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REPO_URL: ${GITHUB_REPO_URL:-https://github.com/chanwenxiang/ai-cabient}
      RUNNER_NAME: ${GITHUB_RUNNER_NAME:-ai-cabinet-local}
      ACCESS_TOKEN: ${GITHUB_RUNNER_TOKEN:-}
      RUNNER_WORKDIR: /tmp/runner/work
      LABELS: self-hosted,linux,ai-cabinet
      RUNNER_SCOPE: repo
      ORG_NAME: ""
      ENTERPRISE_NAME: ""
    volumes:
      - runner_work:/tmp/runner/work
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
    # 预装 Java/Maven/Sonar Scanner；重建：docker compose ... build github-runner --no-cache
    depends_on:
      sonarqube:
        condition: service_healthy

volumes:
  sonarqube_pg:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  runner_work:
