# Prometheus 告警规则（与 CabinetMetrics / DeviceMqttMetrics 指标名一致）

groups:
  - name: ai-cabinet-service
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "服务实例下线"
          description: "job={{ $labels.job }} instance={{ $labels.instance }} 已下线超过 2 分钟"

      - alert: HighErrorRate
        expr: |
          sum by (job, instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum by (job, instance) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "HTTP 5xx 错误率过高"
          description: "{{ $labels.job }} 5xx 占比超过 5%"

      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum by (le, job) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API P95 响应过慢"
          description: "{{ $labels.job }} P95 超过 2 秒"

      - alert: HighMemoryUsage
        expr: |
          jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM 堆内存使用率过高"
          description: "{{ $labels.job }} 堆内存超过 85%"

      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "数据库连接池接近耗尽"
          description: "连接池使用率超过 90%"

      - alert: HighPermissionDeniedRate
        expr: sum(rate(cabinet_permission_denied_total[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "权限拒绝频率异常"
          description: "可能存在越权尝试，请检查审计日志"

  - name: ai-cabinet-business
    rules:
      # ── 开门履约（与运营工作台 / Grafana 看板一致）──
      - alert: DoorOpenSuccessRateLow
        expr: |
          sum(rate(cabinet_door_open_total{result="success"}[5m]))
          /
          (sum(rate(cabinet_door_open_total[5m])) > 0) < 0.95
        for: 5m
        labels:
          severity: warning
          team: ops
          biz: door
        annotations:
          summary: "开门成功率低于 95%"
          description: "近 5 分钟开门成功率 {{ $value | humanizePercentage }}，请检查设备 MQTT / 门锁"

      - alert: DoorOpenSuccessRateCritical
        expr: |
          sum(rate(cabinet_door_open_total{result="success"}[5m]))
          /
          (sum(rate(cabinet_door_open_total[5m])) > 0) < 0.90
        for: 3m
        labels:
          severity: critical
          team: ops
          biz: door
        annotations:
          summary: "开门成功率低于 90%"
          description: "履约核心指标恶化，建议立即排查离线柜与 EMQX"

      - alert: DeviceOfflineRateHigh
        expr: |
          (cabinet_devices_total - cabinet_devices_online)
          / (cabinet_devices_total > 0) > 0.2
        for: 10m
        labels:
          severity: warning
          team: ops
          biz: device
        annotations:
          summary: "设备离线率超过 20%"
          description: "在线 {{ $value | humanizePercentage }} 离线，请查看设备运维"

      - alert: DeviceAllOffline
        expr: cabinet_devices_total > 0 and cabinet_devices_online == 0
        for: 3m
        labels:
          severity: critical
          team: ops
          biz: device
        annotations:
          summary: "全部设备离线"
          description: "无在线柜机，请检查 EMQX / device-service"

      # ── 识别与结算 ──
      - alert: RecognitionLatencyHigh
        expr: |
          rate(cabinet_recognize_duration_seconds_sum[5m])
          / rate(cabinet_recognize_duration_seconds_count[5m]) > 5
        for: 5m
        labels:
          severity: warning
          team: backend
          biz: vision
        annotations:
          summary: "视觉识别平均耗时超过 5 秒"
          description: "请检查 vision-service 负载与模型"

      - alert: SettlementFailureRateHigh
        expr: |
          sum(rate(cabinet_settlement_total{result="failure"}[5m]))
          /
          (sum(rate(cabinet_settlement_total[5m])) > 0) > 0.1
        for: 5m
        labels:
          severity: critical
          team: backend
          biz: settlement
        annotations:
          summary: "结算失败率超过 10%"
          description: "请检查支付通道、余额与订单状态机"

      - alert: DisputeSessionRateHigh
        expr: sum(rate(cabinet_session_transition_total{state="DISPUTED"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          team: ops
          biz: dispute
        annotations:
          summary: "争议会话产生过快"
          description: "争议 QPS 偏高，请关注识别准确率与客服 SLA"

      # ── 对账与资金 ──
      - alert: ReconciliationMismatch
        expr: increase(cabinet_reconciliation_total{status="MISMATCH"}[1h]) > 0
        for: 1m
        labels:
          severity: critical
          team: finance
          biz: reconciliation
        annotations:
          summary: "对账出现 MISMATCH"
          description: "近 1 小时新增对账差额，请进入对账中心处理"

      # ── device-service MQTT ──
      - alert: MqttTradeForwardFailures
        expr: sum(rate(device_trade_forward_total{result="failure"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: backend
          biz: mqtt
        annotations:
          summary: "MQTT 事件转发 trade 失败"
          description: "device-service 向 trade-service 转发失败增多"

      - alert: MqttCommandAckTimeout
        expr: sum(rate(device_command_total{result="ack_timeout"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          team: ops
          biz: mqtt
        annotations:
          summary: "设备指令 ACK 超时"
          description: "柜机可能离线或固件无响应"

  - name: ai-cabinet-scheduled-task
    rules:
      # ── 定时任务：停跑与失败 ──
      # 这两个指标此前只有采集、没有任何规则消费（「指标存在但无人消费」= 没有告警）。
      # 直接证据：tasks_scheduled_execution_seconds_count{...GrowthLogArchiveScheduler,
      # error="UnsupportedTemporalTypeException",outcome="ERROR"} 长期为 1，
      # 该任务 100% 失败却零告警。
      - alert: ScheduledTaskExecutionFailed
        # 覆盖全部 @Scheduled 方法（含未在运营台登记的行），比逐任务白名单更全。
        expr: sum by (code_namespace, code_function, error) (
                increase(tasks_scheduled_execution_seconds_count{outcome="ERROR"}[1h])
              ) > 0
        for: 5m
        labels:
          severity: critical
          team: backend
          biz: scheduler
        annotations:
          summary: "定时任务执行失败"
          description: "{{ $labels.code_namespace }}#{{ $labels.code_function }} 近 1 小时执行失败（{{ $labels.error }}）"

      - alert: ScheduledTaskStale
        # 判据来自 ScheduledTaskStaleMonitor：以 scheduled_task.last_run_at 为准（不看调度台），
        # 已扣除进程停机期。阈值按任务分级，故此处只消费聚合值，避免阈值在两处漂移。
        expr: aicabinet_scheduled_task_stale_count > 0
        for: 15m
        labels:
          severity: critical
          team: ops
          biz: scheduler
        annotations:
          summary: "托管定时任务未按时执行"
          description: "{{ $value }} 个托管任务超过最大静默时长，请查 scheduled_task.last_run_at（调度台状态不可信）"

      - alert: XxlJobWiringBroken
        # 判据来自 XxlJobWiringSelfCheck（启动期一次）：探测调度中心 /api/registry 的响应形态
        # （404=地址带了多余前缀、401=token 不符、连接失败=不可达），比看护早 20~45 分钟发现问题。
        # ⚠️ 该 Gauge 表达的是「本进程启动那一刻的接线状态」，不是实时状态 ——
        # 启动之后才挂掉的调度中心由上面的 ScheduledTaskStale 兜底。
        expr: aicabinet_xxl_job_wiring_ok == 0
        for: 5m
        labels:
          severity: critical
          team: ops
          biz: scheduler
        annotations:
          summary: "XXL-JOB 执行器接线异常"
          description: "执行器与调度中心通道不通（地址前缀/可达性/token 三者之一）。让位已生效，托管任务既不会被 Spring 也不会被调度中心触发；详见启动日志与运营台异常列表"

  - name: ai-cabinet-minio
    rules:
      - alert: MinioDown
        expr: up{job="minio"} == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "MinIO 对象存储不可用"

      - alert: MinioStorageUsageHigh
        expr: minio_cluster_usage_total_bytes > 50 * 1024^3
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "MinIO 总容量超过 50GB"
          description: "当前 {{ $value | humanize1024 }}B"
