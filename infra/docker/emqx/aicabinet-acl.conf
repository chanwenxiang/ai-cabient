%% AI Cabinet MQTT 授权规则（EMQX 5 file authorizer 语法）。
%%
%% 身份模型：
%%   - aicabinet-backend  云端服务（device-service 等）：clientId 固定，放行 cabinet/# 全域
%%   - aicabinet-device   柜机设备（android-app / device-simulator）：
%%                        clientId 必须等于 deviceId，仅能收发自己 cabinet/{deviceId}/# 子树
%%                        （${clientid} 占位符 → 一台设备即使拿到共享密码也伪造不了别的柜机）
%% 未匹配任何规则的发布/订阅一律拒绝（配合 no_match_action=deny 的兜底 {deny, all}.）。
%%
%% 注意：修改本文件后需重启 emqx 容器生效；一旦在 Dashboard 手工改过授权，
%% EMQX 会把规则落盘到 data/authz/acl.conf 并不再读本文件。

{allow, {user, "aicabinet-backend"}, all, ["cabinet/#"]}.
{allow, {user, "aicabinet-device"}, all, ["cabinet/${clientid}/#"]}.
{deny, all}.
