%% AI Cabinet MQTT 授权规则（EMQX 5 file authorizer 语法）。
%%
%% 身份模型（S1 设备独立凭据，见 docs/S1_DEVICE_CREDENTIAL_DESIGN.md）：
%%   - aicabinet-backend     云端服务（device-service 等）：放行 cabinet/# 全域
%%   - aicabinet-device      【仅 dev 栈】共享模拟器账号；生产 bootstrap 不含此账号，
%%                           规则自然失效（认证都过不了）
%%   - <deviceId>（12 位数字）每设备独立账号（device_mqtt_credential 表签发，
%%      bootstrap 逐设备一行）：规则按 ${username} 命名空间放行 —— username=deviceId，
%%      只能收发自己 cabinet/{deviceId}/# 子树。拿着 A 柜凭据以任何 clientId 访问
%%      B 柜主题都会落到 no_match → deny（伪造他柜被拒）。
%%
%% 注意：修改本文件后需重启 emqx 容器生效；一旦在 Dashboard 手工改过授权，
%% EMQX 会把规则落盘到 data/authz/acl.conf 并不再读本文件。

{allow, {user, "aicabinet-backend"}, all, ["cabinet/#"]}.
{allow, {user, "aicabinet-device"}, all, ["cabinet/${clientid}/#"]}.
{allow, all, all, ["cabinet/${username}/#"]}.
{deny, all}.
