# 临时开发覆盖：让 trade-service 优先从宿主机已构建的 admin 前端提供静态资源。
# 用法：docker compose --env-file infra/.env -f infra/docker-compose.full.yml \
#   -f infra/docker-compose.admin-static.yml up -d --build trade-service
# 适用场景：改完 admin-vue 后想立刻在网关看到新 hash，不必等整包前端进 JAR。
services:
  trade-service:
    environment:
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/admin-static/,classpath:/static/
      # AdminUiController 专用：/admin/** 必须显式列出 admin 子目录（否则仍吃 JAR 内旧包）
      AICABINET_ADMIN_UI_RESOURCE_LOCATIONS: file:/app/admin-static/admin/,classpath:/static/admin/
    volumes:
      - ../services/trade-service/src/main/resources/static:/app/admin-static:ro
