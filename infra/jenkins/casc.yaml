jenkins:
  systemMessage: "AI Cabinet：本机用 *-local；后期服务器用 GitHub SCM 任务"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Admin"
          password: "${JENKINS_ADMIN_PASSWORD:-changeme}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_ROOT_URL:-http://localhost:19081/}"
  # locale 插件未就绪时勿写在此处，否则 CasC 启动失败；中文包装好后可再加：
  # locale:
  #   systemLocale: "zh_CN"
  #   ignoreAcceptLanguage: true
  sonarGlobalConfiguration:
    installations:
      - name: "SonarQube"
        serverUrl: "${SONAR_INTERNAL_URL:-http://sonarqube:9000}"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube User Token"
              secret: "${SONAR_TOKEN:-changeme-sonar-token}"

# 注意：必须放在同一条 Job DSL script 里。
# 多条 script 时后一段会把前一段创建的 job 删掉（Job DSL removeAction）。
jobs:
  - script: |
      pipelineJob('ai-cabinet-release-local') {
        description('【本机】/workspace → 编译 → Sonar → 可选部署（无需先推 GitHub）')
        parameters {
          booleanParam('USE_LOCAL_MOUNT', true, '使用 Compose 挂载的 /workspace')
          choiceParam('DEPLOY_MODE', ['none', 'compose-local', 'ssh'], '部署方式')
          stringParam('DEPLOY_HOST', '', 'ssh 服务器')
          stringParam('DEPLOY_USER', 'deploy', 'ssh 用户')
          stringParam('DEPLOY_PATH', '/opt/ai-cabinet', '服务器目录')
        }
        definition {
          cps {
            // 强制本机挂载，避免 boolean 参数变成字符串后判断失败
            script("env.USE_LOCAL_MOUNT='true'\n" + new File('/workspace/Jenkinsfile').getText('UTF-8'))
            sandbox(true)
          }
        }
      }

      pipelineJob('ai-cabinet-sonar-dev-local') {
        description('【本机】/workspace → SonarQube(ai-cabinet-dev)')
        parameters {
          booleanParam('USE_LOCAL_MOUNT', true, '使用 Compose 挂载的 /workspace')
        }
        definition {
          cps {
            script("env.USE_LOCAL_MOUNT='true'\n" + new File('/workspace/Jenkinsfile.sonar-dev').getText('UTF-8'))
            sandbox(true)
          }
        }
      }

      pipelineJob('ai-cabinet-release') {
        description('【后期服务器】GitHub → 编译 → Sonar → 部署（需已推送 Jenkinsfile）')
        parameters {
          booleanParam('USE_LOCAL_MOUNT', false, '正式环境保持 false，从 GitHub checkout')
          choiceParam('DEPLOY_MODE', ['none', 'compose-local', 'ssh'], '部署方式')
          stringParam('DEPLOY_HOST', '', 'ssh 服务器')
          stringParam('DEPLOY_USER', 'deploy', 'ssh 用户')
          stringParam('DEPLOY_PATH', '/opt/ai-cabinet', '服务器目录')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/chanwenxiang/ai-cabient.git')
                }
                branches('*/dev', '*/main', '*/release/*')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }

      pipelineJob('ai-cabinet-sonar-dev') {
        description('【后期服务器】GitHub(dev) → SonarQube(ai-cabinet-dev)')
        parameters {
          booleanParam('USE_LOCAL_MOUNT', false, '正式环境保持 false')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/chanwenxiang/ai-cabient.git')
                }
                branches('*/dev')
              }
            }
            scriptPath('Jenkinsfile.sonar-dev')
            lightweight(true)
          }
        }
      }
