syntax = "proto3";

package aicabinet;

option java_package = "com.aicabinet.proto";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────────────────────────
// ⚠️ 权威性口径（O4 治理，2026-09-19）
//
// 本文件**不是**运行时权威。线上协议是 **JSON over MQTT**，权威定义在两处 Java：
//   · topic 形状   → services/common/common-core/.../mqtt/MqttTopics.java
//   · 命令/事件集合 → services/common/common-core/.../constants/CabinetConstants.java
//
// 本文件是**与上面两者对齐的文档化契约**，由 scripts/check-edge-cloud-mqtt-contract.mjs
// 守卫：proto / Java 常量 / edge Kotlin 硬编码，三方任一漂移 ⇒ 门禁红。
//
// 🔴 本文件**不参与代码生成**（仓库 pom / gradle 里 `protobuf|protoc` 零命中），
//    因此不要假设存在生成产物；它的价值只有一个 —— 被门禁拿来对账。
//
// 🔴 命名约定（门禁依赖，勿破坏）：下行 oneof 字段名 `upper_snake` 后必须**逐字等于**
//    `CabinetConstants.MQTT_CMD_*` 的取值；上行 oneof 字段名同理等于 `MQTT_EVENT_TYPE_*`。
//    例如 oneof 字段 `set_target_temp` ⟷ 常量值 `SET_TARGET_TEMP`。
// ─────────────────────────────────────────────────────────────────────────────

// ── 枚举 ──────────────────────────────────────────

enum DoorState {
  DOOR_UNKNOWN = 0;
  DOOR_OPEN = 1;
  DOOR_CLOSED = 2;
  DOOR_OPENING = 3;
}

enum SessionState {
  SESSION_CREATED = 0;
  SESSION_OPENING = 1;
  SESSION_SHOPPING = 2;
  SESSION_RECOGNIZING = 3;
  SESSION_WAITING_UPLOAD = 4;
  SESSION_SETTLING = 5;
  SESSION_COMPLETED = 6;
  SESSION_DISPUTED = 7;
  SESSION_FAILED = 8;
  SESSION_CANCELLED = 9;
}

enum UploadStatus {
  UPLOAD_NONE = 0;
  UPLOAD_LOCAL_QUEUED = 1;
  UPLOAD_UPLOADING = 2;
  UPLOAD_UPLOADED = 3;
  UPLOAD_FAILED = 4;
}

enum CameraFusionMode {
  FUSION_SINGLE = 0;
  FUSION_MULTI = 1;
}

enum RecognitionSource {
  SOURCE_VISION = 0;
  SOURCE_WEIGHT = 1;
  SOURCE_FUSION = 2;
}

// ── 下行指令（云端 → 设备）：topic = MqttTopics.command(deviceId) ──

message OpenDoorCommand {
  string command_id = 1;
  string session_id = 2;
  int64 user_id = 3;
  int64 expire_at = 4;
  bool operator_mode = 5;
}

message SetTargetTempCommand {
  int32 target_celsius = 1;
}

message LockCommand {
  string reason = 1;
}

message UnlockCommand {
  string reason = 1;
}

message RebootCommand {
  string reason = 1;
}

// 信封字段 `type` 即 MQTT 报文里的 `type` 字段，取值 ∈ MQTT_CMD_*。
message DeviceCommand {
  string command_id = 1;
  string type = 2;
  int64 timestamp = 3;
  oneof payload {
    OpenDoorCommand open_door = 10;
    SetTargetTempCommand set_target_temp = 11;
    LockCommand lock = 12;
    UnlockCommand unlock = 13;
    RebootCommand reboot = 14;
  }
}

// ── 上行事件（设备 → 云端）：topic = MqttTopics.event(deviceId) ──

message VideoClip {
  string camera = 1;       // TOP / SIDE
  string video_uri = 2;
  int64 captured_at = 3;
}

message DoorEvent {
  string session_id = 1;
  DoorState state = 2;
  int64 timestamp = 3;
  string video_uri = 4;
  UploadStatus upload_status = 5;
  repeated VideoClip video_clips = 6;
  CameraFusionMode camera_fusion_mode = 7;
}

message CommandAck {
  string command_id = 1;
  bool success = 2;
  string error_message = 3;
  int64 timestamp = 4;
}

message Heartbeat {
  string device_id = 1;
  int64 timestamp = 2;
  string firmware_version = 3;
  string app_version = 4;
  map<string, string> metrics = 5;
}

message AlertEvent {
  string alert_type = 1;
  string message = 2;
  int64 timestamp = 3;
}

// 信封字段 `type` 即 MQTT 报文里的 `type` 字段，取值 ∈ MQTT_EVENT_TYPE_*。
message DeviceEvent {
  string device_id = 1;
  string type = 2;
  int64 timestamp = 3;
  oneof payload {
    DoorEvent door = 10;
    CommandAck ack = 11;
    Heartbeat heartbeat = 12;
    AlertEvent alert = 13;
  }
}

// ── 识别结果（HTTP，非 MQTT）────────────────────────

message LineItem {
  string sku_id = 1;
  int32 quantity = 2;
  float confidence = 3;
  RecognitionSource source = 4;
}

message RecognitionResult {
  string task_id = 1;
  string session_id = 2;
  repeated LineItem items = 3;
  float overall_confidence = 4;
  string model_version = 5;
  bool need_review = 6;
  CameraFusionMode fusion_mode = 7;
}
