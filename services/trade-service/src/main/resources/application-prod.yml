# 生产环境：启动前必须设置环境变量，见 docs/PRODUCTION.md
app:
  storage:
    local-fallback-enabled: false

aicabinet:
  security:
    mock-enabled: false
  # 2026-10-13 生产首启实证修复：application.yml 基座 cors.allowed-origins 硬编码了
  # http://localhost:5173 / http://127.0.0.1:5173 两个 dev 源且任何 profile 不覆盖，
  # 而 ProductionStartupValidator#rejectLocalhostCorsInProd 在 prod profile 下只要
  # 列表出现 localhost 即拒绝启动 ⇒ SPRING_PROFILES_ACTIVE=prod 永远无法启动
  # （此前生产从未真正以 prod profile 起过栈，staging 不做该检查故未暴露）。
  # prod 覆盖为纯环境变量注入：同源部署留空=不放宽跨域；跨域部署填运营域名。
  cors:
    allowed-origins:
      - ${CORS_ORIGIN:}
  # 2026-10-13 支付阶段模式：prod 不再字面钉死 true，改由环境显式声明（缺省即启动失败，
  # 保持 fail-loud）；docker-compose.production.yml 对这两个变量做 :? 必填校验。
  wechat-pay:
    enabled: ${WECHAT_PAY_ENABLED}
  wechat-miniapp:
    enabled: ${WECHAT_MINIAPP_ENABLED}
  reconciliation:
    mock-enabled: false
    scheduled-enabled: true

spring:
  flyway:
    placeholders:
      # C01+H15: 生产禁用种子守卫迁移（V202/V244/V252/V253/V254/V262 的写语句被 seed_env 守卫跳过）
      seed_env: none

# H47: 生产关闭 SpringDoc OpenAPI / Swagger UI（默认开启会暴露全部接口结构，且无 spring-security 鉴权）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.aicabinet: INFO
