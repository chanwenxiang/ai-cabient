server:
  port: 8080

spring:
  application:
    name: trade-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15433/aicabinet}
    username: ${SPRING_DATASOURCE_USERNAME:aicabinet}
    password: ${SPRING_DATASOURCE_PASSWORD:aicabinet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: trade-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

aicabinet:
  checkout:
    balance-only: ${CHECKOUT_BALANCE_ONLY:false}
    preauth-cents: ${CHECKOUT_PREAUTH_CENTS:2000}
  security:
    mock-enabled: ${AICABINET_MOCK_ENABLED:true}
    captcha-enabled: ${AICABINET_CAPTCHA_ENABLED:true}
  amap:
    web-key: ${AMAP_WEB_KEY:}
  staging-mode: ${AICABINET_STAGING_MODE:false}
  gravity-fallback-settle: ${AICABINET_GRAVITY_FALLBACK_SETTLE:false}
  internal-api:
    key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  device-service:
    url: ${AICABINET_DEVICE_SERVICE_URL:http://localhost:8081}
  vision-service:
    url: ${AICABINET_VISION_SERVICE_URL:http://localhost:8082}
  auth:
    jwt-secret: ${JWT_SECRET:ai-cabinet-dev-secret-key-32bytes!!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}
    cookie-enabled: ${AUTH_COOKIE_ENABLED:true}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:10}
    sms:
      mock-code: ${SMS_MOCK_CODE:}
      ttl-seconds: 300
      webhook-url: ${SMS_WEBHOOK_URL:}
      provider: ${SMS_PROVIDER:webhook}
      aliyun-access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:}
      aliyun-access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:}
      aliyun-sign-name: ${SMS_ALIYUN_SIGN_NAME:}
      aliyun-template-code: ${SMS_ALIYUN_TEMPLATE_CODE:}
      aliyun-region-id: ${SMS_ALIYUN_REGION_ID:cn-hangzhou}
  cors:
    allowed-origins:
      - ${CORS_ORIGIN:http://localhost:8080}
      - http://localhost:5173
      - http://127.0.0.1:5173
  wechat-pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    notify-url: ${WECHAT_NOTIFY_URL:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    merchant-serial-no: ${WECHAT_MCH_SERIAL:}
    private-key: ${WECHAT_PRIVATE_KEY:}
    platform-cert: ${WECHAT_PLATFORM_CERT:}
    platform-cert-auto-fetch: ${WECHAT_PLATFORM_CERT_AUTO_FETCH:true}
  wechat-miniapp:
    enabled: ${WECHAT_MINIAPP_ENABLED:false}
    app-id: ${WECHAT_MINIAPP_ID:}
    app-secret: ${WECHAT_MINIAPP_SECRET:}
    subscribe-template-id: ${WECHAT_MERCHANT_SUBSCRIBE_TEMPLATE:}
    notify-page: pages/alerts/alerts
    consumer-subscribe-template-id: ${WECHAT_CONSUMER_SUBSCRIBE_TEMPLATE:}
    consumer-notify-page: pages/messages/messages
  notify:
    wechat-enabled: ${NOTIFY_WECHAT_ENABLED:false}
    sms-enabled: ${NOTIFY_SMS_ENABLED:false}
    async-enabled: ${NOTIFY_ASYNC_ENABLED:false}
  wechat-web:
    enabled: ${WECHAT_WEB_ENABLED:true}
    app-id: ${WECHAT_WEB_APP_ID:}
    app-secret: ${WECHAT_WEB_APP_SECRET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:cabinet-videos}
    presign-expiry-seconds: 3600
  vision-async:
    enabled: false
  vision-api:
    key: ${VISION_API_KEY:dev-vision-key-change-me}
  reconciliation:
    mock-enabled: ${RECON_MOCK_ENABLED:true}
    wechat-bill-type: ${WECHAT_BILL_TYPE:ALL}
    scheduled-enabled: ${RECON_SCHEDULED_ENABLED:false}
    scheduled-cron: ${RECON_SCHEDULED_CRON:0 30 1 * * *}
  risk:
    enabled: ${RISK_CONTROL_ENABLED:true}
    max-opens-per-hour: ${RISK_MAX_OPENS_PER_HOUR:5}
    max-disputes-per-7-days: ${RISK_MAX_DISPUTES_PER_7_DAYS:3}
  profit-sharing:
    enabled: ${PROFIT_SHARING_ENABLED:false}
    mock-enabled: ${PROFIT_SHARING_MOCK_ENABLED:false}
    retry-enabled: ${PROFIT_SHARING_RETRY_ENABLED:true}
    retry-batch-size: ${PROFIT_SHARING_RETRY_BATCH_SIZE:20}
  line-withdraw:
    mock-enabled: ${LINE_WITHDRAW_MOCK_ENABLED:${AICABINET_MOCK_ENABLED:true}}
    min-amount-cents: ${LINE_WITHDRAW_MIN_CENTS:100}
    daily-limit-cents: ${LINE_WITHDRAW_DAILY_LIMIT_CENTS:500000}
    review-threshold-cents: ${LINE_WITHDRAW_REVIEW_THRESHOLD_CENTS:50000}
  merchant-withdraw:
    mock-enabled: ${MERCHANT_WITHDRAW_MOCK_ENABLED:${AICABINET_MOCK_ENABLED:true}}
    min-amount-cents: ${MERCHANT_WITHDRAW_MIN_CENTS:100}
    daily-limit-cents: ${MERCHANT_WITHDRAW_DAILY_LIMIT_CENTS:500000}
    review-threshold-cents: ${MERCHANT_WITHDRAW_REVIEW_THRESHOLD_CENTS:50000}
  qr:
    # auto = 自动探测本机局域网 IP（手机同网可扫）；也可写成 http://192.168.x.x
    public-host: ${QR_PUBLIC_HOST:auto}
    consumer-h5-base: ${CONSUMER_H5_BASE:auto}
    wechat-mp-app-id: ${WECHAT_MP_APPID:}
    wechat-mp-path: ${WECHAT_MP_PATH:pages/index/index}
    wechat-mp-env: ${WECHAT_MP_ENV:release}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:}
    agreement-product-code: ${ALIPAY_AGREEMENT_PRODUCT_CODE:GENERAL_WITHHOLDING}
    agreement-notify-url: ${ALIPAY_AGREEMENT_NOTIFY_URL:}
    agreement-sign-scene: ${ALIPAY_AGREEMENT_SIGN_SCENE:DEFAULT}
  payscore:
    enabled: ${PAYSCORE_ENABLED:false}
    mock-enabled: ${PAYSCORE_MOCK_ENABLED:true}
    min-score: ${PAYSCORE_MIN_SCORE:550}
    live-charge-enabled: ${PAYSCORE_LIVE_CHARGE_ENABLED:false}
    charge-gateway-url: ${PAYSCORE_CHARGE_GATEWAY_URL:}
    charge-gateway-api-key: ${PAYSCORE_CHARGE_GATEWAY_API_KEY:}
  dispute-sla:
    hours: ${DISPUTE_SLA_HOURS:48}
    reminder-hours-before: ${DISPUTE_SLA_REMINDER_HOURS:12}
    alert-webhook-url: ${DISPUTE_SLA_WEBHOOK:}
    scheduler-enabled: ${DISPUTE_SLA_SCHEDULER:true}
  ops-monitoring:
    enabled: ${OPS_MONITORING_ENABLED:true}
    scan-interval-ms: ${OPS_MONITORING_INTERVAL_MS:30000}
    door-open-minutes: ${OPS_DOOR_OPEN_MINUTES:10}
    upload-stuck-minutes: ${OPS_UPLOAD_STUCK_MINUTES:5}
    recognition-stuck-minutes: ${OPS_RECOGNITION_STUCK_MINUTES:3}
    settlement-stuck-minutes: ${OPS_SETTLEMENT_STUCK_MINUTES:3}
  merchant-ai:
    enabled: ${MERCHANT_AI_ENABLED:true}
    base-url: ${MERCHANT_AI_BASE_URL:http://localhost:11434}
    model: ${MERCHANT_AI_MODEL:qwen2.5:1.5b}
  xxljob:
    # Docker apps 默认 true；本地 IDEA 默认 false，避免无调度中心时资金任务停跑
    enabled: ${XXL_JOB_ENABLED:false}
  devops:
    enabled: ${DEVOPS_HUB_ENABLED:true}
    grafana-url: ${DEVOPS_GRAFANA_URL:http://localhost:13000}
    grafana-health-url: ${DEVOPS_GRAFANA_HEALTH_URL:${DEVOPS_GRAFANA_URL:http://localhost:13000}}
    prometheus-url: ${DEVOPS_PROMETHEUS_URL:http://localhost:9090}
    prometheus-health-url: ${DEVOPS_PROMETHEUS_HEALTH_URL:${DEVOPS_PROMETHEUS_URL:http://localhost:9090}}
    jenkins-url: ${DEVOPS_JENKINS_URL:http://localhost:19081}
    jenkins-health-url: ${DEVOPS_JENKINS_HEALTH_URL:${DEVOPS_JENKINS_URL:http://localhost:19081}}
    # 服务端调 Jenkins API（Docker 内多为 http://jenkins:8080；本机 IDEA 默认跟 jenkins-url）
    jenkins-api-url: ${DEVOPS_JENKINS_API_URL:${DEVOPS_JENKINS_HEALTH_URL:${DEVOPS_JENKINS_URL:http://localhost:19081}}}
    jenkins-user: ${DEVOPS_JENKINS_USER:admin}
    jenkins-password: ${DEVOPS_JENKINS_PASSWORD:${JENKINS_ADMIN_PASSWORD:changeme}}
    sonar-jenkins-job: ${DEVOPS_SONAR_JENKINS_JOB:ai-cabinet-sonar-dev-local}
    sonar-url: ${DEVOPS_SONAR_URL:http://localhost:19002}
    sonar-health-url: ${DEVOPS_SONAR_HEALTH_URL:${DEVOPS_SONAR_URL:http://localhost:19002}}
    github-url: ${DEVOPS_GITHUB_URL:https://github.com}
    grafana-embed-path: ${DEVOPS_GRAFANA_EMBED_PATH:/devops/grafana/d/ai-cabinet-overview/ai-cabinet-overview?orgId=1&kiosk=tv&theme=light}

app:
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./data/attachments}
    local-fallback-enabled: ${APP_STORAGE_LOCAL_FALLBACK_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# ── Resilience4j: 熔断与重试 ──
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      visionService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
    instances:
      deviceService:
        base-config: default

# ── 分布式追踪（OpenTelemetry） ──
tracing:
  otlp:
    endpoint: ${OTLP_ENDPOINT:}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

# XXL-JOB 执行器（调度中心独立部署；XXL_JOB_ENABLED=true 时注册）
# 资金类任务见 XxlJobManagedTasks；控制台默认 http://localhost:18090/xxl-job-admin
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:trade-service}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_EXECUTOR_LOG_PATH:./logs/xxl-job/jobhandler}
      log-retention-days: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
