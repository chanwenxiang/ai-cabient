# 预发/试点：接近 prod 的安全与 SMS 实链路；视觉 mock 关闭，需 YOLO（VISION_INSTALL_ML=true）
# 无微信进件时默认余额-only + 对账 mock（可用 RECON_MOCK_ENABLED / CHECKOUT_BALANCE_ONLY 覆盖）
aicabinet:
  security:
    mock-enabled: false
  staging-mode: true
  checkout:
    balance-only: ${CHECKOUT_BALANCE_ONLY:true}
    preauth-cents: ${CHECKOUT_PREAUTH_CENTS:2000}
  auth:
    sms:
      mock-code: "000000"
  wechat-pay:
    enabled: false
  wechat-miniapp:
    enabled: false
  reconciliation:
    mock-enabled: ${RECON_MOCK_ENABLED:true}
    scheduled-enabled: false

logging:
  level:
    root: INFO
    com.aicabinet: INFO
