# 预发/试点：接近 prod 的安全与 SMS 实链路；视觉 mock 关闭（云端识别已退役，生产识别走端侧直报）
# 无微信进件时默认余额-only；对账 mock 默认关（审计 P2-20，可用 RECON_MOCK_ENABLED 显式打开联调）
aicabinet:
  security:
    mock-enabled: false
  staging-mode: true
  checkout:
    balance-only: ${CHECKOUT_BALANCE_ONLY:true}
    preauth-cents: ${CHECKOUT_PREAUTH_CENTS:2000}
  wechat-pay:
    enabled: false
  wechat-miniapp:
    enabled: false
  reconciliation:
    mock-enabled: ${RECON_MOCK_ENABLED:false}
    scheduled-enabled: false

logging:
  level:
    root: INFO
    com.aicabinet: INFO
