    <script>
      (function () {
        var p = location.pathname || '';
        if (!/\/index\.html$/i.test(p)) return;
        var b = p.replace(/\/index\.html$/i, '');
        if (b.slice(-1) !== '/') b += '/';
        var h = location.hash || '';
        var r = '';
        if (h.indexOf('#/') === 0) {
          r = h.slice(1);
          if (!r || r.charAt(0) !== '/') r = '';
        }
        location.replace(b + (r ? r.replace(/^\//, '') : '') + (location.search || ''));
      })();
    </script>
