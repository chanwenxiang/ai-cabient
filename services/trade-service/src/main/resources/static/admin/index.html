         /admin/devices/favicon.svg ⇒ 每次进详情页 404，控制台多一条红。base 固定 /admin/。 -->

  <body>
    <a class="skip-link" href="#main-content">跳到主内容</a>
    <div id="app"></div>
    <script>
      (function () {
        var p = location.pathname || '';
        if (!/\/index\.html$/i.test(p)) return;
        var b = p.replace(/\/index\.html$/i, '');
        if (b.slice(-1) !== '/') b += '/';
        var h = location.hash || '';
        var r = '';
        if (h.indexOf('#/') === 0) {
          r = h.slice(1);
          if (!r || r.charAt(0) !== '/') r = '';
        }
        location.replace(b + (r ? r.replace(/^\//, '') : '') + (location.search || ''));
      })();
    </script>
  </body>
