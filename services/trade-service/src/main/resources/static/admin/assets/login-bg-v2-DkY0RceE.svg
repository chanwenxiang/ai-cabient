<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="48%" stop-color="#0c1f38"/>
      <stop offset="100%" stop-color="#0e3a46"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1240 420) rotate(90) scale(640 420)">
      <stop stop-color="#2dd4bf" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 320) rotate(90) scale(420 320)">
      <stop stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#67e8f9" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1a2e" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#123a44" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>

  <!-- 左侧电路脉络（表单区保持深色简洁） -->
  <g stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="2">
    <path d="M80 260 H360 V420 H600"/>
    <path d="M120 700 H300 V860 H560"/>
    <path d="M220 500 H420"/>
    <path d="M260 240 V420"/>
  </g>
  <g fill="#2dd4bf" fill-opacity="0.5">
    <circle cx="360" cy="420" r="5"/>
    <circle cx="600" cy="420" r="5"/>
    <circle cx="300" cy="860" r="5"/>
    <circle cx="560" cy="860" r="5"/>
    <circle cx="420" cy="500" r="4"/>
  </g>

  <!-- 智能柜主体 -->
  <g>
    <rect x="1060" y="250" width="460" height="660" rx="30" fill="#0d1626" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="1090" y="286" width="400" height="480" rx="16" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.35"/>

    <!-- 柜门竖分隔 + 扫描线 -->
    <path d="M1290 286 V766" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="1287" y="290" width="6" height="472" rx="3" fill="url(#scan)" opacity="0.7"/>

    <!-- 三层货架与商品 -->
    <g stroke="#67e8f9" stroke-opacity="0.28" stroke-width="2">
      <path d="M1090 442 H1490"/>
      <path d="M1090 586 H1490"/>
      <path d="M1090 730 H1490"/>
    </g>
    <g>
      <rect x="1110" y="324" width="74" height="112" rx="10" fill="#155e75" opacity="0.9"/>
      <rect x="1204" y="340" width="62" height="96" rx="9" fill="#1d4ed8" opacity="0.75"/>
      <rect x="1306" y="316" width="80" height="120" rx="12" fill="#0f766e" opacity="0.9"/>
      <rect x="1410" y="334" width="58" height="102" rx="9" fill="#164e63" opacity="0.85"/>

      <rect x="1110" y="470" width="62" height="110" rx="9" fill="#1e3a8a" opacity="0.7"/>
      <rect x="1204" y="456" width="80" height="124" rx="12" fill="#155e75" opacity="0.9"/>
      <rect x="1316" y="474" width="60" height="106" rx="9" fill="#0f766e" opacity="0.8"/>
      <rect x="1410" y="462" width="74" height="118" rx="10" fill="#164e63" opacity="0.88"/>

      <rect x="1110" y="616" width="76" height="108" rx="10" fill="#0f766e" opacity="0.9"/>
      <rect x="1210" y="632" width="60" height="92" rx="9" fill="#1d4ed8" opacity="0.7"/>
      <rect x="1312" y="610" width="78" height="114" rx="12" fill="#155e75" opacity="0.9"/>
    </g>
    <g stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2">
      <path d="M1130 380 h34 M1140 360 h14 M1230 380 h20 M1320 372 h36 M1432 380 h18"/>
      <path d="M1130 520 h24 M1240 506 h24 M1330 528 h30 M1432 520 h20"/>
      <path d="M1140 664 h28 M1234 672 h18 M1340 664 h34"/>
    </g>

    <!-- 顶部摄像头 + 扫描光锥 -->
    <rect x="1240" y="212" width="140" height="38" rx="19" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="1310" cy="231" r="10" fill="#2dd4bf" fill-opacity="0.85"/>
    <circle cx="1310" cy="231" r="4" fill="#062033"/>
    <polygon points="1250,250 1370,250 1310,560" fill="#2dd4bf" fill-opacity="0.06"/>

    <!-- 门禁 LED 灯带 -->
    <rect x="1090" y="762" width="400" height="8" rx="4" fill="#2dd4bf" fill-opacity="0.85"/>
    <circle cx="1140" cy="812" r="6" fill="#38bdf8" fill-opacity="0.7"/>
    <circle cx="1170" cy="812" r="6" fill="#38bdf8" fill-opacity="0.4"/>
    <circle cx="1200" cy="812" r="6" fill="#38bdf8" fill-opacity="0.7"/>

    <!-- 柜门二维码 -->
    <rect x="1380" y="600" width="72" height="72" rx="8" fill="#e2e8f0"/>
    <g fill="#0f172a">
      <rect x="1392" y="612" width="14" height="14"/>
      <rect x="1426" y="612" width="14" height="14"/>
      <rect x="1392" y="646" width="14" height="14"/>
      <rect x="1426" y="646" width="14" height="14"/>
      <rect x="1410" y="630" width="10" height="10"/>
      <rect x="1396" y="624" width="6" height="6"/>
      <rect x="1430" y="628" width="8" height="8"/>
    </g>

    <!-- 底座 -->
    <rect x="1040" y="922" width="500" height="20" rx="10" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.3"/>
  </g>

  <!-- 悬浮功能芯片 -->
  <g>
    <circle cx="982" cy="330" r="34" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M972 322 l20 8 l-20 8 z" fill="#2dd4bf" fill-opacity="0.8"/>

    <circle cx="1570" cy="430" r="30" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <g stroke="#38bdf8" stroke-opacity="0.75" stroke-width="2.4" fill="none">
      <path d="M1552 428 a18 18 0 0 1 36 0"/>
      <path d="M1558 422 a12 12 0 0 1 24 0"/>
    </g>

    <rect x="940" y="560" width="88" height="88" rx="18" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <circle cx="984" cy="584" r="10" fill="#2dd4bf" fill-opacity="0.75"/>
    <path d="M970 622 h28 M962 610 h36" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2"/>

    <rect x="1546" y="640" width="92" height="92" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.32"/>
    <circle cx="1592" cy="666" r="11" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M1592 650 a16 16 0 0 1 0 32" fill="#38bdf8" fill-opacity="0.6"/>
    <path d="M1572 700 h40" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- 背景点缀 -->
  <g stroke="#93c5fd" stroke-opacity="0.14" stroke-width="2">
    <path d="M700 250 C860 180 1000 180 1120 250"/>
    <path d="M760 940 C940 880 1120 880 1300 940"/>
  </g>
  <g fill="#2dd4bf" fill-opacity="0.35">
    <circle cx="1120" cy="250" r="4"/>
    <circle cx="1300" cy="940" r="4"/>
    <circle cx="700" cy="250" r="3"/>
  </g>
</svg>
