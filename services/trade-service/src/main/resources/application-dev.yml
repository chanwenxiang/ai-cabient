# 本地开发 profile（默认 SPRING_PROFILES_ACTIVE=dev）
# 代码路径与生产相同，仅 mock-enabled=true 时走 mock 分支
aicabinet:
  security:
    mock-enabled: ${AICABINET_MOCK_ENABLED:true}
  auth:
    sms:
      # 仅 dev/mock 联调：固定码便于脚本；prod/staging 禁止 123456/000000（见 ProductionStartupValidator）
      mock-code: ${SMS_MOCK_CODE:123456}
  risk:
    max-opens-per-hour: 200
    max-disputes-per-7-days: 50
  reconciliation:
    mock-enabled: true
    wechat-bill-type: ALL
  alipay:
    enabled: ${ALIPAY_ENABLED:false}

logging:
  level:
    com.aicabinet: DEBUG
