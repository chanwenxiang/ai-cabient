spring:
  datasource:
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

aicabinet:
  security:
    mock-enabled: true
  reconciliation:
    mock-enabled: true
    scheduled-enabled: false
  wechat-pay:
    enabled: false
  wechat-miniapp:
    enabled: false
  alipay:
    enabled: false

logging:
  level:
    com.aicabinet: INFO
