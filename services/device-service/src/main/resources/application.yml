server:
  port: 8081

spring:
  application:
    name: device-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

aicabinet:
  internal-api:
    key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  mqtt:
    broker: ${MQTT_BROKER:tcp://localhost:11883}
    client-id: ${MQTT_CLIENT_ID:device-service}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    trust-store-path: ${MQTT_TRUST_STORE:}
    trust-store-password: ${MQTT_TRUST_STORE_PASSWORD:}
    persistence-dir: ${MQTT_PERSISTENCE_DIR:data/mqtt-paho}
  trade-service:
    url: ${AICABINET_TRADE_SERVICE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
