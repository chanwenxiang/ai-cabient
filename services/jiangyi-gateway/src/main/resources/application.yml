server:
  port: 8083

spring:
  application:
    name: jiangyi-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

aicabinet:
  internal-api:
    # trade → gateway 转发（如开门指令）经 InternalApiAuthInterceptor 校验同一把 key
    key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
    allowed-cidrs: ${INTERNAL_API_ALLOWED_CIDRS:}
    trusted-proxy-cidrs: ${INTERNAL_API_TRUSTED_PROXY_CIDRS:}
  trade-service:
    url: ${AICABINET_TRADE_SERVICE_URL:http://localhost:8080}
  jiangyi:
    # 设备 token 签发密钥（JWT HS256）。🔴 无默认值：未配置时 /jiangyi/api/token 返回 503
    # fail-closed（方案 §3）；只在部署环境注入，不落仓库（铁律 #27）。
    jwt-secret: ${JIANGYI_JWT_SECRET:}
    # 设备 token 有效期（秒），默认 7 天
    token-ttl-seconds: ${JIANGYI_TOKEN_TTL_SECONDS:604800}
    # 识别上报 → 会话关门合成的轮询兜底（秒）：WS 无关门上报（模式一），
    # 会话靠识别上报先行合成 door-event CLOSED，超时则由 trade 侧扫描兜底
    session-open-timeout-seconds: ${JIANGYI_SESSION_OPEN_TIMEOUT_SECONDS:90}
    # OSS STS 直传凭证（CB-024 §4.2.6）。🔴 AK/RoleArn 无默认值：未配置时
    # getTempUploadToken 返回 500 fail-closed（不影响购物主链路）；只在部署环境注入（铁律 #27）
    oss:
      access-key-id: ${JIANGYI_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${JIANGYI_OSS_ACCESS_KEY_SECRET:}
      role-arn: ${JIANGYI_OSS_ROLE_ARN:}
      region: ${JIANGYI_OSS_REGION:cn-shenzhen}
      bucket: ${JIANGYI_OSS_BUCKET:ai-cabinet-by}
      dir-name: ${JIANGYI_OSS_DIR_NAME:jiangyi-video/}
      session-seconds: ${JIANGYI_OSS_SESSION_SECONDS:900}
      # 预签名 GET URL 有效期（秒，CB-029 运营侧视频复核读路径），夹在 [60,3600]
      presign-seconds: ${JIANGYI_OSS_PRESIGN_SECONDS:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
