name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aicabinet
          POSTGRES_USER: aicabinet
          POSTGRES_PASSWORD: aicabinet
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Matches pom.xml <node.version>v24.18.0</node.version> (frontend-maven-plugin also pins this)
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Build & Test (trade-service)
        run: mvn verify -DskipITs -pl services/trade-service -am
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15433/aicabinet
          SPRING_DATASOURCE_USERNAME: aicabinet
          SPRING_DATASOURCE_PASSWORD: aicabinet
          REDIS_HOST: localhost
          REDIS_PORT: "6379"

      - name: Build (device-service)
        run: mvn compile -pl services/device-service -am
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15433/aicabinet

      - name: Vision mock unit tests (pytest, no YOLO weights)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=vision-service pytest -q vision-service/tests/test_delta_recognizer.py
        working-directory: ${{ github.workspace }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  mini-programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Consumer MP type-check
        run: pnpm --filter @aicabinet/consumer-mp run type-check

      - name: Merchant MP type-check
        run: pnpm --filter @aicabinet/merchant-mp run type-check

      - name: Consumer MP H5 build
        run: pnpm --filter @aicabinet/consumer-mp run build:h5

      - name: Merchant MP H5 build
        run: pnpm --filter @aicabinet/merchant-mp run build:h5
