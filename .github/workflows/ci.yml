name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aicabinet
          POSTGRES_USER: aicabinet
          POSTGRES_PASSWORD: aicabinet
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 防止真实密钥/私钥被提交进仓库（测试用的动态生成密钥不含固定 PEM 内容）
      - name: Secret scan (tracked files only)
        run: |
          set -euo pipefail
          hits=$(git ls-files -z ':!.github/workflows/ci.yml' | xargs -0 grep -Il \
            -e 'AKIA[0-9A-Z]\{16\}' \
            -e '-----BEGIN RSA PRIVATE KEY-----' \
            -e '-----BEGIN EC PRIVATE KEY-----' \
            -e '-----BEGIN OPENSSH PRIVATE KEY-----' \
            -e 'ghp_[A-Za-z0-9]\{20,\}' \
            -e 'sk_live_[A-Za-z0-9]\{20,\}' \
            -e 'sk-[A-Za-z0-9]\{20,\}' \
            -e 'MIIE[A-Za-z0-9+/]\{40,\}' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "possible secret(s) in tracked files:"
            echo "$hits"
            exit 1
          fi
          echo "secret scan: no matches"

      # 生产模板门禁：模板内不允许出现真实密钥/弱默认值，mock 必须关闭
      - name: Production env template gate
        run: |
          set -euo pipefail
          env_file="infra/.env.production.example"
          test -f "$env_file" || { echo "missing $env_file"; exit 1; }
          grep -q '^AICABINET_MOCK_ENABLED=false$' "$env_file" \
            || { echo "AICABINET_MOCK_ENABLED must be false in production template"; exit 1; }
          grep -q '^VISION_MOCK_ENABLED=false$' "$env_file" \
            || { echo "VISION_MOCK_ENABLED must be false in production template"; exit 1; }
          grep -q '^RECON_MOCK_ENABLED=false$' "$env_file" \
            || { echo "RECON_MOCK_ENABLED must be false in production template"; exit 1; }
          grep -q '^AUTH_COOKIE_SECURE=true$' "$env_file" \
            || { echo "AUTH_COOKIE_SECURE must be true in production template"; exit 1; }
          grep -q '^MQTT_BROKER=ssl://' "$env_file" \
            || { echo "MQTT_BROKER must be ssl:// in production template"; exit 1; }
          grep -q '^WECHAT_APP_ID=wxYOUR_APP_ID$' "$env_file" \
            || { echo "WECHAT_APP_ID must stay as placeholder in production template"; exit 1; }
          grep -q '^JWT_SECRET=CHANGE-ME-production-jwt-secret-32bytes-min$' "$env_file" \
            || { echo "JWT_SECRET must stay as CHANGE-ME placeholder in production template"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Matches pom.xml <node.version>v24.18.0</node.version> (frontend-maven-plugin also pins this)
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          # build job 只用 node 跑脚本，不走 pnpm install；关掉 v5 按 packageManager 自动缓存
          package-manager-cache: false

      - name: Migration safety gate (new Flyway scripts)
        # 纯 Node 脚本，无需 pnpm install（此前 pnpm 无 node_modules 时 exit -2）
        run: node scripts/check-migration-safety.mjs
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/dev' }}

      # 防绕过自测：空头 `-- MIGRATION_REVIEWED: yes` 必须被上面那道门禁拒绝。
      # 该测试自 2026-09 起就存在，但从未被任何流水线调用（`spawnSync` 的是
      # check-migration-safety.mjs 本身）—— 属「测试资产未接 CI」，故补齐。
      # 它会临时写入 V9999__tmp_migration_reviewed_gate_<ts>.sql 并在 finally 中删除。
      - name: Migration gate bypass self-test
        run: node scripts/check-migration-reviewed-gate.test.mjs
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/dev' }}

      - name: Build & Test (trade-service)
        run: mvn verify -DskipITs -pl services/trade-service -am
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15433/aicabinet
          SPRING_DATASOURCE_USERNAME: aicabinet
          SPRING_DATASOURCE_PASSWORD: aicabinet
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      # 依赖 Docker（Testcontainers）的测试在缺 Docker 时会被**静默跳过**：类上标着
      # `@Testcontainers(disabledWithoutDocker = true)`，JUnit 直接禁用整个类，surefire
      # 仍写出一份 **0 条用例**的报告，`mvn` 照样 SUCCESS。这里把"跳过"变成构建失败。
      #
      # 🔴 判据只看 `<testcase>` 元素个数：`*.txt` 的 `Tests run:` 与 XML 根元素的 `tests=`
      #    在 @Nested 类上都会写 0，按它们判会「一条都没跑却照样绿」（§11.16 / O7）。
      # 🔴 用**源码自动发现**而不是硬编码名单：2026-09-19 实测旧白名单只列了 3 个 E2E，
      #    而 `ReconciliationIntegrationTest` / `WeChatNotifyIntegrationTest` 两个同样带
      #    `@Testcontainers` 的类**从来没被任何守卫覆盖过** —— 名单模式下新增一个测试类
      #    同样不会被发现，静默跳过无人知。
      # 本 job 是 `mvn verify -DskipITs -pl services/trade-service -am`：
      #   `*Test.java` → surefire 跑（本 job 范围内）；
      #   `*IT.java`   → failsafe 跑，被 `-DskipITs` 跳过，由 integration job 的守卫覆盖。
      - name: Verify Docker-backed tests ran (no silent skip)
        run: |
          set -euo pipefail

          found=0
          while IFS= read -r src; do
            # 只认真正的注解行（行首，允许缩进）——注释里提到 @Testcontainers 不算。
            grep -qE '^[[:space:]]*@Testcontainers' "$src" || continue
            mod=${src%%/src/test/java/*}
            [ -d "$mod/target" ] || continue      # 本 job 没构建该模块 ⇒ 不在范围内
            fqcn=${src#*/src/test/java/}
            fqcn=${fqcn%.java}
            fqcn=$(printf '%s' "$fqcn" | tr '/' '.')
            report="$mod/target/surefire-reports/TEST-$fqcn.xml"
            if [ ! -f "$report" ]; then
              echo "RED  $fqcn  有源码但**没有 surefire 报告** ⇒ 该测试根本没执行"
              ls -1 "$mod/target/surefire-reports" 2>/dev/null | head -5 || true
              exit 1
            fi
            n=$(grep -o '<testcase ' "$report" | wc -l || true)
            if [ "$n" -lt 1 ]; then
              echo "RED  $fqcn  testcases=0 ⇒ 静默跳过（Docker 不可用 / 容器起不来 / 被 disabled）"
              exit 1
            fi
            if grep -qE '<failure|<error' "$report"; then
              echo "RED  $fqcn  出现 failure/error（mvn 应已失败，这里再判一次）"
              exit 1
            fi
            echo "ok   $fqcn  testcases=$n"
            found=$((found + 1))
          done < <(find services -path '*/src/test/java/*' -name '*Test.java' | sort)

          # 护栏：扫描逻辑自己失效时不能「零发现即通过」（否则判据恒真）。
          if [ "$found" -lt 1 ]; then
            echo "RED  一个带 @Testcontainers 的 *Test.java 都没扫到 ⇒ 扫描逻辑失效（源码里明明有）"
            exit 1
          fi

          # 权限漂移守卫不带 @Testcontainers，但它是 RBAC 的核心判据，单独钉住。
          report=services/trade-service/target/surefire-reports/TEST-com.aicabinet.trade.auth.PermissionCodeDriftTest.xml
          if [ ! -f "$report" ]; then
            echo "RED  PermissionCodeDriftTest 没有 surefire 报告"
            exit 1
          fi
          n=$(grep -o '<testcase ' "$report" | wc -l || true)
          if [ "$n" -lt 1 ]; then
            echo "RED  PermissionCodeDriftTest testcases=0 ⇒ 静默跳过"
            exit 1
          fi
          if grep -qE '<failure|<error' "$report"; then
            echo "RED  PermissionCodeDriftTest 出现 failure/error"
            exit 1
          fi
          echo "ok   com.aicabinet.trade.auth.PermissionCodeDriftTest  testcases=$n"

          echo "Docker-backed 测试守卫通过：$found 个 @Testcontainers 类真跑"

      # ⚠️ admin 产物校验**不在这里**：`.mvn/maven.config` 内含 `-Dskip.admin.build=true`
      # （2026-08-04 由 VS Code 自动提交 d389885c 引入），Maven 会自动加载该文件且命令行无关，
      # 所以上面的 `mvn verify` 其实**不会**重建 static/admin —— CI 日志里三个前端 execution
      # 全部打印 "Skipping execution."。2026-09-16 前此处用 `git diff --exit-code` 校验产物，
      # 因产物从未被重建，那道门禁**永远无法失败**（E-1 的"闭环"实为空转，历时约 6 周）。
      # 现改由独立的 `admin-artifacts` job 在**不走 Maven** 的前提下显式重建并比对。

      - name: Admin bundle size budget
        run: node scripts/check-admin-bundle-budget.mjs

      # 契约对齐：启动刚构建的 jar，导出 /v3/api-docs 并校验 generated TS 已提交
      # 仓库 .npmrc 为 Windows 配了 script-shell=cmd.exe；Linux CI 须改回 bash
      - name: Verify OpenAPI-generated types are up-to-date
        env:
          npm_config_script_shell: /bin/bash
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15433/aicabinet
          SPRING_DATASOURCE_USERNAME: aicabinet
          SPRING_DATASOURCE_PASSWORD: aicabinet
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          AICABINET_MOCK_ENABLED: 'true'
          JWT_SECRET: ci-openapi-check-jwt-secret-32bytes-min
          INTERNAL_API_KEY: ci-internal-api-key
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile
          JAR=$(ls services/trade-service/target/trade-service-*.jar | grep -v original | head -1)
          test -n "$JAR"
          mkdir -p .tmp
          java -jar "$JAR" --server.port=18080 > .tmp/trade-openapi.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          ok=0
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:18080/v3/api-docs" -o .tmp/live-openapi.json; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "trade-service failed to expose /v3/api-docs"
            tail -n 80 .tmp/trade-openapi.log || true
            exit 1
          fi
          OPENAPI_CHECK_REGEN=1 OPENAPI_FILE=.tmp/live-openapi.json pnpm check:openapi-types

      # device-service 此前只跑 `mvn compile` ⇒ 6 个测试类（38 条）在 CI 里从未执行；
      # edge/device-simulator（根 pom 第 4 个 module）则完全没被 CI 触碰。
      # 二者并入同一条 `mvn test`：`-am` 只会带出 common-core，不会重跑 trade-service。
      - name: Test (device-service + device-simulator)
        run: mvn test -pl services/device-service,edge/device-simulator -am
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15433/aicabinet
          SPRING_DATASOURCE_USERNAME: aicabinet
          SPRING_DATASOURCE_PASSWORD: aicabinet
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      # 防静默跳过：报告缺失 / 用例数低于基线 / 出现 failure|error|skipped ⇒ 红。
      # ⚠️ 真值只在 `<testcase>` 元素个数上。@Nested 用例类（SimulatorSupportTest）的 `.txt`
      # 写的是 `Tests run: 0`、XML 根元素的 `tests=` 同样是 0（用例全在嵌套类里），因此只断言
      # `Failures: 0, Errors: 0, Skipped: 0` 的写法在「一条用例都没跑」时照样是绿的。
      - name: Verify device tests ran (no silent skip)
        run: |
          set -euo pipefail
          check() { # $1=xml 路径  $2=用例数下限  $3=类名
            xml="$1"
            test -f "$xml" || { echo "missing surefire report: $xml"; exit 1; }
            n=$(grep -o '<testcase ' "$xml" | wc -l || true)
            [ "$n" -ge "$2" ] || { echo "$3: only $n testcases in $xml (baseline >= $2)"; exit 1; }
            if grep -qE '<failure|<error|<skipped' "$xml"; then
              echo "$3: $xml contains failure/error/skipped"; exit 1
            fi
            echo "ok  $3  testcases=$n"
          }
          R=target/surefire-reports
          check services/device-service/$R/TEST-com.aicabinet.common.security.InternalApiAuthInterceptorTest.xml 6  InternalApiAuthInterceptorTest
          check services/device-service/$R/TEST-com.aicabinet.device.client.TradeServiceClientRetryTest.xml 4  TradeServiceClientRetryTest
          check services/device-service/$R/TEST-com.aicabinet.device.mqtt.DoorEventDeduplicatorTest.xml 5  DoorEventDeduplicatorTest
          check services/device-service/$R/TEST-com.aicabinet.device.mqtt.MqttEventListenerDoorTest.xml 14 MqttEventListenerDoorTest
          check services/device-service/$R/TEST-com.aicabinet.device.service.DeviceCommandServiceTest.xml 2  DeviceCommandServiceTest
          check services/device-service/$R/TEST-com.aicabinet.device.service.DeviceCommandTrackerTest.xml 7  DeviceCommandTrackerTest
          check edge/device-simulator/$R/TEST-com.aicabinet.simulator.SimulatorSupportTest.xml 23 SimulatorSupportTest

      # Maven runtime 全树 → OSV；有 finding 时 exit 1。pip-audit 尽力而为（缺工具不挡门）。
      - name: Backend dependency OSV audit
        run: node scripts/audit-backend-deps.mjs

      - name: Upload OSV findings
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: osv-findings
          path: target/osv-findings.json
          if-no-files-found: ignore

      - name: Vision mock unit tests (pytest, no YOLO weights)
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          PYTHONPATH=vision-service pytest -q vision-service/tests/test_mock_recognizer.py vision-service/tests/test_ip_guard.py
        working-directory: ${{ github.workspace }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'

  # ── 集成测试（Testcontainers；需要 Docker）─────────────────────────────────
  # 背景（2026-09-19 实测）：根 pom 此前只有 surefire，而 surefire 默认排除 `**/*IT.java`
  # ⇒ device-service 的 IT（EMQX `$share` 组只投递一次；模拟器↔device↔trade 契约端到端）
  # **没有任何入口**：`mvn verify` BUILD SUCCESS、日志里 0 次提及它、也没有 target/failsafe-reports。
  # 本 job 用 failsafe（根 pom 已绑定 integration-test + verify）真正跑它，并守住
  # 「报告在、用例数为 0」这种静默跳过 —— 真值只在 `<testcase>` 元素个数上，
  # 不是 `*.txt` 的 `Tests run:` 也不是 XML 根元素的 `tests=`。
  # 守卫**遍历全部 TEST-*.xml**：此前只盯 EmqxSharedSubscriptionIT 一个文件，新增 IT 后
  # 它静默不跑无人知（同一个坑换个文件名就能绕过去）。
  # ⚠️ failsafe 跑在 package 之后，`spring-boot:repackage` 已把本模块主 artifact 换成 fat jar
  # ⇒ fork classpath 里本模块那条正是 fat jar（`BOOT-INF/classes` 不能当 classpath 类用），
  # 任何引用本模块类的 `*IT` 都会在 discover 阶段 ClassNotFoundException，而不引用本模块类的
  # 老 IT 反而侥幸能跑。根 pom 用 `<additionalClasspathElements>${project.build.outputDirectory}`
  # 把 classes 目录补回 fork classpath。
  # 该 IT 带 @Testcontainers(disabledWithoutDocker = true)：无 Docker 时 JUnit 显式禁用；
  # GH 托管 runner 有 Docker ⇒ 这里要求它**真跑**，一条都没跑就是红。
  # 不挂 postgres/redis services：device-service 的单测是纯 Mockito，IT 只用 Testcontainers。
  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # `verify` 会先跑 surefire 单测再跑 failsafe 集成测试。刻意不复用 build job 的单测结果：
      # 想「只跑 IT」就得用 -DskipTests，而 skipTests 会把 failsafe 一起跳过（那正是要防的静默跳过）。
      - name: Integration tests (device-service)
        run: mvn -B verify -pl services/device-service -am

      - name: Verify integration tests ran (no silent skip)
        run: |
          set -euo pipefail

          # 判据只看 `<testcase>` 元素个数：`*.txt` 的 `Tests run:` 与 XML 根元素的 tests=
          # 在 @Nested / IT 类上都会写 0，按它们判会「一条都没跑却照样绿」。

          # ① 反向扫：已生成的每份报告都必须真跑过用例、且没有 failure/error。
          reports=()
          while IFS= read -r r; do reports+=("$r"); done \
            < <(find services edge -path '*/target/failsafe-reports/TEST-*.xml' 2>/dev/null | sort)
          if [ "${#reports[@]}" -lt 1 ]; then
            echo "RED  一份 failsafe 报告都没有 ⇒ IT 静默跳过（failsafe 没绑到 verify，或被整体跳过）"
            ls -1d */target/failsafe-reports 2>/dev/null || true
            exit 1
          fi
          for report in "${reports[@]}"; do
            name=$(basename "$report" .xml)
            n=$(grep -o '<testcase ' "$report" | wc -l || true)
            if [ "$n" -lt 1 ]; then
              echo "RED  $name  执行了 0 条用例 ⇒ 静默跳过（被 disabled 或根本没跑到）"
              exit 1
            fi
            if grep -qE '<failure|<error' "$report"; then
              echo "RED  $name  出现 failure/error（mvn 应已失败，这里再判一次）"
              exit 1
            fi
            echo "ok   $name  testcases=$n"
          done

          # ② 正向扫（防「新 IT 根本没被发现」）：源码里每个 *IT.java 都必须有对应报告。
          #    只遍历已有报告是**不够**的 —— 新 IT 若在 discover 阶段就出局（如 failsafe 的
          #    fork classpath 里本模块是 fat jar ⇒ ClassNotFoundException），连报告文件都不会
          #    生成，① 会一无所知，换个文件名就能绕过守卫。
          #    「在不在本 job 范围内」用 `<module>/target/` 是否存在判断：本 job 是
          #    `mvn verify -pl services/device-service -am`，被构建的模块一定有 target/；
          #    没被构建的模块（如 trade-service）在 CI 全新检出下没有 target/ ⇒ 跳过，不误红。
          #    ⚠️ 本 job 的 -pl 范围变化时这条规则自动跟随，无需改脚本。
          missing=0
          while IFS= read -r src; do
            mod=${src%%/src/test/java/*}
            [ -d "$mod/target" ] || continue          # 本 job 没构建该模块 ⇒ 不在范围内
            fqcn=${src#*/src/test/java/}
            fqcn=${fqcn%.java}
            fqcn=$(printf '%s' "$fqcn" | tr '/' '.')
            report="$mod/target/failsafe-reports/TEST-$fqcn.xml"
            if [ ! -f "$report" ]; then
              echo "RED  $fqcn  有源码但**没有报告** ⇒ 该 IT 根本没被执行（discover 阶段就出局）"
              ls -1 "$mod/target/failsafe-reports" 2>/dev/null \
                || echo "     (该模块没有 failsafe-reports 目录)"
              missing=$((missing + 1))
              continue
            fi
            if [ "$(grep -o '<testcase ' "$report" | wc -l || true)" -lt 1 ]; then
              echo "RED  $fqcn  报告在但 0 条用例 ⇒ 静默跳过"
              missing=$((missing + 1))
            fi
          done < <(find services edge -path '*/src/test/java/*' -name '*IT.java' 2>/dev/null | sort)

          if [ "$missing" -gt 0 ]; then
            echo "有 $missing 个 *IT.java 没有被真正执行"
            exit 1
          fi
          echo "集成测试守卫通过：真跑报告 ${#reports[@]} 份，源码中全部 *IT.java 均有对应报告且无失败"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-test-results
          path: '**/target/failsafe-reports/*.xml'
          if-no-files-found: ignore

  # ── admin 产物新鲜度（stale-artifact gate）──────────────────────────────────
  # 背景：`services/trade-service/src/main/resources/static/admin` 是被 git 跟踪、
  # 并由 nginx 直接 bind mount 对外的前端产物；它一旦落后于 `clients/admin-vue` 源码，
  # 线上 UI 就是旧代码，而 `mvn verify` 检测不到（见 build job 里的说明：maven.config
  # 把 admin 构建整个跳过了）。E-1 就是这么发生的。
  # 因此本 job 刻意**完全不走 Maven**，用与开发者本地一致的入口重建后比对。
  admin-artifacts:
    runs-on: ubuntu-latest
    # 仓库 .npmrc 为 Windows/Cursor 配置了 script-shell=cmd.exe；Linux CI 必须改回 bash，
    # 否则 `pnpm install` 的 lifecycle 脚本在 Linux 上会走 cmd.exe 直接失败（本 job 首跑即栽在这）。
    env:
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v5

      # Matches pom.xml <node.version>v24.18.0</node.version>
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      # 与本地同一入口（scripts/build-admin.mjs = vue-tsc --noEmit + vite build），
      # 保证"CI 认为同源"与"开发者本地跑一遍也同源"是同一个判据。
      - name: Rebuild admin UI
        run: node scripts/build-admin.mjs

      # 用 `git status --porcelain` 而非 `git diff --exit-code`：
      # 主因已由上面的 job 注释说明（产物从未被重建，判据恒真）。此外 `git diff` 还有一处
      # 独立的潜在弱点：vite 产物带内容哈希，`git diff` 只反映已跟踪文件的改动，对新增
      # （untracked）文件完全无感（本次实测 `emptyOutDir` 会清空，故删除可见、主因不在此，
      # 但判据仍应选能覆盖新增的那一个）。两者叠加，故此处必须用 `git status --porcelain`。
      - name: Verify admin UI artifacts are up-to-date
        run: |
          set -euo pipefail
          # -uall：否则整个 assets/ 都成为未跟踪时会被折叠成一行，诊断信息不足
          changed=$(git status --porcelain -uall -- services/trade-service/src/main/resources/static/admin)
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::static/admin 与 clients/admin-vue 源码不同步：请在本地运行 \`node scripts/build-admin.mjs\` 并提交产物"
            exit 1
          fi
          echo "OK: static/admin 与源码同源"

  mini-programs:
    runs-on: ubuntu-latest
    # 仓库 .npmrc 为 Windows/Cursor 配置了 script-shell=cmd.exe；Linux CI 须改回 bash
    env:
      npm_config_script_shell: /bin/bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          # 仍用 corepack 启 pnpm；避免 setup-node 自动缓存与手动 prepare 抢跑
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Frontend dependency audit (prod)
        run: pnpm audit:frontend

      - name: Merchant nav-guard path helpers
        run: pnpm check:merchant-nav-guard

      # 审计防回归：端点字面量 / pageSize / token 存储 / cron zone / cache 名 / dialog a11y / 布局防抖 / 表列语义 / 小程序 a11y / 余额冻结类型两端一致 / UAT 类选择器有效性 / 编号类输入框不得用数字键盘 / XXL-JOB 托管任务接线（清单↔handler↔种子↔调度中心 context-path）
      - name: Audit regression gates
        run: pnpm check:audit-gates

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Admin a11y smoke
        run: pnpm smoke:admin-a11y

      - name: Build shared packages
        run: pnpm build:packages

      - name: Shared RBAC unit tests
        run: pnpm --filter @aicabinet/shared-rbac test

      # admin 单测此前从不被 CI 调用（与 test:mp 同一类覆盖缺口）
      - name: Admin unit tests (vitest)
        run: pnpm --filter @aicabinet/admin-vue test

      # 两端 mp 的纯逻辑此前只被 Playwright e2e（需 dev 栈）覆盖，改坏不会红
      - name: Consumer MP unit tests (vitest)
        run: pnpm --filter @aicabinet/consumer-mp test

      - name: Merchant MP unit tests (vitest)
        run: pnpm --filter @aicabinet/merchant-mp test

      - name: Nav-permission alignment check
        run: pnpm check:nav-perms

      - name: OpenAPI types structural gate
        run: pnpm check:openapi-types

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Consumer MP type-check
        run: pnpm --filter @aicabinet/consumer-mp run type-check

      - name: Merchant MP type-check
        run: pnpm --filter @aicabinet/merchant-mp run type-check

      - name: Consumer MP H5 build
        run: pnpm --filter @aicabinet/consumer-mp run build:h5

      - name: Merchant MP H5 build
        run: pnpm --filter @aicabinet/merchant-mp run build:h5

  # 行为级端到端：真实浏览器跑三端 H5 UAT。
  #
  # 背景（详见 docs/three-end-full-audit-2026-09-15.md 第 11/12 章）：
  #   - 这些套件此前从不被 CI 调用，修复等于白修；
  #   - 且它们长期在登录步就整轮中断（首屏隐私弹窗遮挡 + 登录判定查废弃 token key），
  #     44/19 条声明用例实际只跑成 5/1 条。
  # 因此本条流水线的首要价值是：让「整轮崩溃」和「新增失败」不再静默通过。
  # 已知缺陷（余额流水 ¥0.00 等）用 UAT_MAX_FAIL 基线显式记录，修复后请下调。
  e2e-h5:
    runs-on: ubuntu-latest
    env:
      npm_config_script_shell: /bin/bash
      # H5 dev server 的 /api 代理指向直跑的后端（CI 无 nginx 网关）
      VITE_DEV_PROXY: http://127.0.0.1:8080
      # runner 无系统 Chrome，使用 Playwright 自带 chromium
      PW_CHANNEL: chromium
      # 图形验证码改走 TCP 直连 Redis（不依赖 docker 容器名）
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CONSUMER_H5_URL: http://127.0.0.1:3002
      MERCHANT_H5_URL: http://127.0.0.1:3001
      ADMIN_URL: http://127.0.0.1:8080/admin
      API_BASE: http://127.0.0.1:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:15433/aicabinet
      SPRING_DATASOURCE_USERNAME: aicabinet
      SPRING_DATASOURCE_PASSWORD: aicabinet
      AICABINET_MOCK_ENABLED: 'true'
      JWT_SECRET: ci-e2e-jwt-secret-32bytes-minimum
      INTERNAL_API_KEY: ci-e2e-internal-api-key
      # 已知失败基线（ratchet）。首次接入取本地实测值；若 CI 数据导致偏差请据实校准，
      # 但只允许下调（修复）或平级调整（环境差异），不允许为了变绿而上调。
      # 2026-09-16：consumer 5 → 4 → **0**。第二批假红/假绿的根因逐个挖掉之后归零：
      #   · .transaction-row/.transaction-more 是重构前的旧类名（真值 .log-row/.more）
      #   · DEMO_DISPUTE_TICKET_* 常量库里早已 0 行 → 改为 API 探测种子
      #   · fillPlaceholder 用的是 admin 端 SkuVisionEnrollView 的 placeholder（'例如 CAB-001'），
      #     consumer 报修页真值是「请输入柜机编号」→ 输入框永远填不进值
      #   · 柜机编号输入用 uni-app type="digit"，H5 渲染成 <input type="number">，
      #     浏览器丢弃字母 → 打不出 CAB-001（产品缺陷，已改 type="text"）
      #   · 开门主路径缺少「柜机可售」前置断言 → 改为探测 + 不可售时 SKIP，并新增 TC-OPEN-005
      # 本地实测 pass=37 / fail=0 / skip=9（skip 均为种子/环境缺口，不是失败）。
      UAT_MAX_FAIL_CONSUMER: '0'
      # 2026-09-16：merchant 2 → **0**。两条根因都挖到了底：
      #   · TC-IMP-032 / M-10v 把 merchant_cookie_auth（值为 '1' 的标记，不是 JWT）拼成
      #     `Bearer 1` → 服务端短路 Cookie 鉴权 → 401 → 工单探测恒为空、录像探测恒为空
      #     （M-14 里的三条 401 就是它）
      #   · TC-IMP-032 用整页文本断言 `!/暂未扣款/`，而抽屉背后的工单列表里「待审核」那条
      #     的合法文案正是"本次暂未扣款" → 断言范围过大导致的假红，已收敛到 .app-sheet
      # 本地实测 pass=29 / fail=0 / skip=2。
      UAT_MAX_FAIL_MERCHANT: '0'
      UAT_MAX_FAIL_BUSINESS: '3'
      UAT_MAX_FAIL_DISPUTE: '2'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aicabinet
          POSTGRES_USER: aicabinet
          POSTGRES_PASSWORD: aicabinet
        ports:
          - 15433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      # -Pskip-admin-ui：admin 产物已提交在 static/admin，无需在 e2e 里重建
      - name: Build backend jar
        run: mvn -B -DskipTests -Pskip-admin-ui package -pl services/trade-service -am

      # Flyway 迁移含 demo 种子（V222/V253 等），空库可自动就绪
      - name: Start backend
        run: |
          set -euo pipefail
          JAR=$(ls services/trade-service/target/trade-service-*.jar | grep -v original | head -1)
          test -n "$JAR"
          nohup java -jar "$JAR" --server.port=8080 > backend-e2e.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "Started TradeServiceApplication" backend-e2e.log; then
              echo "backend started after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          tail -n 100 backend-e2e.log
          exit 1

      - name: Start H5 dev servers
        run: |
          set -euo pipefail
          (cd clients/consumer-mp && nohup node ./node_modules/@dcloudio/vite-plugin-uni/bin/uni.js > "$GITHUB_WORKSPACE/h5-3002.log" 2>&1 &)
          (cd clients/merchant-mp && nohup node ./node_modules/@dcloudio/vite-plugin-uni/bin/uni.js > "$GITHUB_WORKSPACE/h5-3001.log" 2>&1 &)
          for port in 3002 3001; do
            ok=0
            for i in $(seq 1 90); do
              if curl -sf "http://127.0.0.1:${port}/" -o /dev/null; then
                echo "h5 :${port} ready after ~$((i * 2))s"
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "h5 :${port} failed to start"
              tail -n 60 "$GITHUB_WORKSPACE/h5-${port}.log" 2>/dev/null || true
              exit 1
            fi
          done

      # 三类脚本解析到的 playwright 版本不同：admin 侧脚本走仓库根依赖（1.55.0），
      # 两端小程序走各自 package.json（1.62.1）。两版本绑定的 chromium revision 不同，
      # 只装一次会让另一批脚本报 "Executable doesn't exist"。必须按版本各装一次。
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          (cd clients/consumer-mp && pnpm exec playwright install chromium)
          (cd clients/merchant-mp && pnpm exec playwright install chromium)

      # 三个 admin 侧脚本（admin-uat / role-regression / batch-imp）依赖采购单等业务数据，
      # 暂不纳入；待其种子脚本补齐后按同样方式接入。
      - name: Consumer H5 UAT
        run: UAT_MAX_FAIL="$UAT_MAX_FAIL_CONSUMER" node tests/consumer-h5-uat.mjs
        working-directory: clients/consumer-mp

      - name: Merchant H5 UAT
        run: UAT_MAX_FAIL="$UAT_MAX_FAIL_MERCHANT" node tests/merchant-h5-uat.mjs
        working-directory: clients/merchant-mp

      - name: Three-end business UAT
        run: UAT_MAX_FAIL="$UAT_MAX_FAIL_BUSINESS" node tests/three-end-business-uat.mjs
        working-directory: clients/admin-vue

      # 前置：scripts/create-open-dispute.ps1 生成种子；Linux 下等价地由后端接口建单，
      # 若种子缺失脚本会以 exit 2 退出——那属于环境未就绪，不应视为产品回归。
      # M17：不再 continue-on-error 无条件吞失败；改为失败后重试 1 次（共 2 次，留间隔等环境就绪），
      # 真实回归（非环境类失败）最终仍会让 job 变红。
      - name: Three-end dispute UAT
        shell: bash
        run: |
          set -uo pipefail
          max=2
          attempt=1
          final=0
          while [ "$attempt" -le "$max" ]; do
            set +e
            UAT_MAX_FAIL="$UAT_MAX_FAIL_DISPUTE" node tests/three-end-dispute-ui-uat.mjs
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "dispute UAT attempt ${attempt}/${max} failed (exit ${code})"
            if [ "$code" -eq 2 ]; then
              final=2
            elif [ "$final" -ne 2 ]; then
              final=1
            fi
            if [ "$attempt" -eq "$max" ]; then
              break
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          if [ "$final" -eq 2 ]; then
            echo "::warning::dispute UAT 环境未就绪（CI 缺 .tmp/open-dispute.json 种子链路：模拟器+MQTT+vision）。已知遗留，原被 continue-on-error 掩盖；真实回归请本地跑 create-open-dispute.ps1 + 本 UAT。"
            exit 0
          fi
          exit 1
        working-directory: clients/admin-vue

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: h5-uat-evidence
          path: |
            clients/consumer-mp/output/playwright/
            clients/merchant-mp/output/playwright/
            clients/admin-vue/output/playwright/
            backend-e2e.log
            h5-3001.log
            h5-3002.log
          if-no-files-found: ignore

  # ── Android 真机端（edge/android-app）单测 ─────────────────────────────────────
  # 这一端此前**从不被 CI 碰过**：它是 Gradle Kotlin DSL、不在 Maven reactor 里，
  # 本机/CI 都没有 ANDROID_HOME ⇒ 长期被登记为「不可构建」。装上 SDK 后它跑得起来，
  # 缺口于是从「跑不了」变成「没人调」（门禁失效形态①）—— 本 job 就是那个调用者。
  #
  # SDK 与 Gradle 依赖都走 cache：无 cache 时这一步要下 ~200MB SDK + 首次依赖解析，
  # 有 cache 时只剩编译与执行。
  edge-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 仓库**不含 gradle wrapper**（无 gradlew / gradle-wrapper.jar，已取证），
      # 所以不能写 `./gradlew`。改用官方 action 装指定发行版，与本地构建同为 8.9；
      # 该 action 自带依赖缓存，无需再手写 actions/cache。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-platform34-buildtools34-v1

      - name: Install Android SDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # `yes` 会被 sdkmanager 提前关掉管道 ⇒ 在 pipefail 下拿到 141，故兜底。
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null

      # 单独一步、无条件执行：SDK 命中缓存时上一步被跳过，env 就再没人写了。
      - name: Export Android SDK location
        run: echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Android unit tests
        working-directory: edge/android-app
        run: gradle :app:testMockDebugUnitTest --no-daemon --stacktrace

      # 与 build/integration job 同款判据：**只看 `<testcase>` 元素个数**。
      # gradle 在无测试源时同样 exit 0（NO-SOURCE），只看退出码等于「没测也能绿」。
      - name: Verify Android tests actually ran (no silent skip)
        working-directory: edge/android-app
        run: |
          set -euo pipefail
          shopt -s nullglob
          report_dir=app/build/test-results/testMockDebugUnitTest
          reports=("$report_dir"/TEST-*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "RED  没有测试报告($report_dir) ⇒ 用例根本没执行"
            exit 1
          fi
          total=0
          for report in "${reports[@]}"; do
            n=$(grep -o '<testcase ' "$report" | wc -l || true)
            total=$((total + n))
            if grep -qE '<failure|<error' "$report"; then
              echo "RED  $(basename "$report") 出现 failure/error"
              exit 1
            fi
          done
          if [ "$total" -lt 1 ]; then
            echo "RED  报告在、但 <testcase> 元素为 0 ⇒ 静默跳过（这正是要防的那种绿）"
            exit 1
          fi
          echo "ok  edge/android-app  testcases=$total（${#reports[@]} 份报告）"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-unit-test-reports
          path: edge/android-app/app/build/reports/tests/testMockDebugUnitTest/
          if-no-files-found: ignore
